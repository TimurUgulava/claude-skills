    типовые_креативные_углы:
      - «отдел продаж рядом» — карточка у объекта на Картах
      - маршрут в Навигаторе до шоурума ЖК
      - отзывы и рейтинг застройщика в карточке
    комментарий_прохора: >
      Базовая локальная гигиена: без живой карточки организации объект на Картах
      «не существует». Дешёвый канал нижней воронки под шоурум. Не путай с Директом —
      тут ты управляешь присутствием на Картах, а не аукционом ставок.

# ============================================================
# ПРИНЦИПЫ ЗАПОЛНЕНИЯ (для тех, кто расширяет файл)
# ============================================================
# 1. Никаких чисел без объекта-источника. Нет подтверждения → "[△ требует подтверждения]"
#    или "нет надёжных данных, нужен пилот". Гипотезы → "[◐ гипотеза → A/B]".
# 2. Классифайды и карты волатильны: тарифы и CPL переписываются — все числа здесь
#    стартовые ориентиры, Прохор актуализирует их живым WebSearch на момент сессии и
#    обновляет дата_актуализации.
# 3. "не_подходит_для" важнее "подходит_для" — спасает от рекомендации мёртвого канала.
# 4. Модерация — конкретными пунктами под антимодерационный чек этапа 3 + юрфильтр 214-ФЗ:
#    апартаменты ≠ квартира, запрет доходности, цена/ипотека только с декларацией и банком,
#    ОГРН/юрлицо, маркировка ОРД и erid.
# 5. Рендеры объекта — не выдавать за фото. По умолчанию графика отдаётся чистой, без
#    знака на самом изображении. Маркировка "это AI-картинка, а не фото объекта" живёт
#    текстовым токеном [▢ AI-визуализация] в артефакте рядом с картинкой, а не в пикселях.
#    Впечатать watermark в пиксель — опционально, только по явному запросу заказчика.
# 6. Комментарий Прохора — в авторском голосе (деловой средне-жёсткий профжаргон),
#    данные и бенчмарки — сухой профэталон.
#
# Источники актуализации (вместо Perplexity — встроенный WebSearch/WebFetch):
#   - WebSearch: тарифы и CPL площадок, кейсы, тренды (см. references/research-actualization.md)
#   - WebFetch: данные по прямой ссылке (тарифные страницы, проект ЖК в режиме B)
#   - Открытые тарифы платформ (Циан, Авито, Домклик, Яндекс, 2GIS), кейсы Cossa/Sostav/vc.ru
