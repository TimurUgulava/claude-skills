    не_подходит_для:
      - объекты без физической точки (офиса/шоурума) для карточки
      - федеральный brand-охват без гео-привязки
      - склады вне логистических зон
    форматы:
      - приоритетная карточка организации в Картах и Поиске
      - подписка Яндекс.Бизнес (продвижение + автоприменение в рекламных продуктах)
      - метка и баннер в Навигаторе при построении маршрута
    бенчмарки_2026:
      стоимость_подписки_месяц:
        значение: "зависит от города и конкуренции в категории — уточнять по тарифам"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "Яндекс Бизнес подписка стоимость карточка организации 2026 тарифы город"
      эффект_на_визиты_в_шоурум:
        значение: "рост локальных переходов и звонков — измерять через метки, не обещать заранее"
        тип_источника: hypothesis
        статус_токен: "[◐ гипотеза → A/B]"
        запрос: "Яндекс Бизнес карточка организации эффективность переходы звонки кейс"
      дата_актуализации: 2026-04-28
      примечание_прохора: >
        Это про присутствие на Картах и в Навигаторе, а не про охватный перформанс.
        Тариф беру живым WebSearch под город; эффект на визиты держу как гипотезу под
