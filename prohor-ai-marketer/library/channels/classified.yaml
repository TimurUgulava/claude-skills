# Прохор — библиотека каналов: КЛАССИФАЙДЫ И КАРТЫ
# Категория channel_categories: classified (Авито, Циан, Домклик, Яндекс Недвижимость)
#                              + карты/справочники (2GIS, Яндекс.Бизнес)
#
# Назначение: верифицированный датасет, из которого Прохор ПОДБИРАЕТ каналы под тип
# объекта и стадию проекта, а не выдумывает. Каждая карточка — по канонической схеме.
#
# ЯДРО ДОВЕРИЯ. Любой бенчмарк — это объект {значение, тип_источника, ссылка_или_запрос,
# дата, статус}. Поле бенчмарков несёт:
#   тип_источника: verified-library | web-search | hypothesis | object-claim
#   статус_токен:  "[✓ источник]" | "[◐ гипотеза → A/B]" | "[△ требует подтверждения]"
# Числа без подтверждённого источника в этом файле помечены "[△ требует подтверждения]"
# или "[◐ гипотеза → A/B]" — Прохор обязан актуализировать их живым WebSearch на момент
# сессии (см. references/research-actualization.md) и обновить дата_актуализации.
# Тарифы и CPL классифайдов волатильны и зависят от региона/класса/конкуренции —
# фиксированных «правильных» чисел нет, есть диапазоны на подтверждение.
#
# Схема карточки — единая для всех файлов library/channels/.
# v1 сужен до жильё + апарты; коммерческие пометки (стрит-ритейл, склады) — ранний контур.

channels:

  # ============================================================
  # 1. ЦИАН — премиум-размещение и продвижение
  # ============================================================
  - channel_id: cian_premium
    название: Циан — премиум и продвижение
    категория: classified
    этапы_воронки: [вовлечение, лидген, конверсия]
    подходит_для:
      - ЖК эконом / комфорт / бизнес / премиум
      - апарт-комплексы и сервисные апартаменты
      - стрит-ритейл первых этажей (через Циан Коммерческая — ранний контур)
      - БЦ (через Циан Коммерческая — ранний контур)
    не_подходит_для:
      - ТРЦ (нет потребительской вертикали — это не лизинг площадей)
      - склады (вертикаль есть, но аудитория слабая)
      - холодная первичная узнаваемость (классифайд ловит сформированный спрос)
    форматы:
      - премиум-карточка ЖК (расширенная витрина застройщика)
      - топ-выдача / поднятие в результатах
      - брендированный блок застройщика
      - 3D-туры, планировки, фотоотчёты хода стройки
      - рассылки по подписчикам района
    бенчмарки_2026:
      CPL_ЖК_комфорт_СПб:
        значение: "2000–5000 ₽"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "Циан CPL ЖК комфорт-класс СПб 2026 стоимость лида застройщик"
      стоимость_премиум_размещения_месяц:
        значение: "80 000–250 000 ₽ (зависит от города и объёма витрины)"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "Циан тарифы премиум-размещение застройщик 2026 стоимость месяц"
      дата_актуализации: 2026-04-28
      примечание_прохора: >
        Числа держу как стартовый диапазон, не как факт. Перед медиа-миксом гоню живой
        WebSearch под конкретный город и класс — тарифы Циан переписываются регулярно.
    особенности_модерации:
      запрещено:
        - агрессивные сравнения «лучше, чем ЖК X» по названию конкурента
        - обещания инвестиционной доходности и гарантированного роста цены
        - неактуальная цена / фото не того объекта
      требуется:
        - актуальная проектная декларация и разрешение на строительство
        - название юрлица застройщика и ОГРН
        - маркировка рекламы (ОРД, erid) для продвигаемых форматов
    типовые_креативные_углы:
      - детальная квартирография и евро-планировки
      - 3D-туры и интерактивные планировки
      - инфраструктура района и время до метро
      - ход строительства (фотоотчёты по очередям)
    комментарий_прохора: >
      Must-have для жилки в Москве и СПб — без Циан кампания неполная, тут сидит
      аудитория в активном поиске квартиры. Для бизнеса и премиума заходим только
      с богатым контентом: туры, дрон-съёмка, нормальные планировки. Голую карточку
      премиум-покупатель пролистывает.

  # ============================================================
  # 2. АВИТО — продвижение объявлений
  # ============================================================
  - channel_id: avito_promo
    название: Авито — продвижение объявлений и Авито Недвижимость
    категория: classified
    этапы_воронки: [вовлечение, лидген]
    подходит_для:
      - ЖК эконом / комфорт (особенно регионы)
      - апарт-комплексы
      - стрит-ритейл и коммерческие помещения в аренду (ранний контур)
      - склады в аренду (ранний контур)
    не_подходит_для:
      - элитная новостройка (там Циан и прямые продажи, аудитория Авито не та)
      - крупные ТРЦ (нет механики лизинга площадей)
    форматы:
      - «Поднятие в поиске» и пакеты продвижения объявления
      - XL / премиум-объявление
      - Авито для бизнеса (кабинет застройщика, выгрузка фида лотов)
    бенчмарки_2026:
      CPL_квартира_эконом:
        значение: "800–2500 ₽"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "Авито стоимость лида квартира эконом новостройка 2026 застройщик"
      стоимость_продвижения_объявления_месяц:
        значение: "1500–8000 ₽ за лот (зависит от города и пакета)"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "Авито недвижимость тарифы продвижение объявления застройщик 2026"
      дата_актуализации: 2026-04-28
      примечание_прохора: >
        Лид с Авито дешёвый, но «грязнее» по качеству — много прозвонщиков и торга.
        В медиа-вердикте по absorption этот канал хорошо давит конверсию на эконом/комфорт,
        но не подавай его как канал премиума.
    особенности_модерации:
      запрещено:
        - дублирование одного лота в нескольких объявлениях
        - неактуальные фото и цены, фото чужого объекта
        - обещания доходности и гарантий по апартам
      требуется:
        - реальные фото объекта (рендеры маркируются текстовым токеном [▢ AI-визуализация] в артефакте рядом с картинкой, не выдаём за фото)
        - ОГРН застройщика в карточке
        - маркировка ОРД, erid для продвигаемых объявлений
    типовые_креативные_углы:
      - конкретная квартира: планировка + вид из окна + этаж
      - «от застройщика» без переплаты посреднику
      - готов к заселению / предчистовая white-box
      - евро-планировки и метраж под бюджет
    комментарий_прохора: >
      Рабочая лошадь эконома и комфорта, особенно в регионах. В Москве и СПб слабее
      Циан — тут аудитория больше про вторичку и аренду. Для коммерческой аренды в малых
      городах — основной канал. Гони лоты фидом, не вешай вручную по одному.

  # ============================================================
  # 3. ДОМКЛИК (Сбер) — ипотечная воронка
  # ============================================================
  - channel_id: domclick
    название: Домклик (Сбер) — витрина новостроек и ипотечная воронка
    категория: classified
    этапы_воронки: [лидген, конверсия]
    подходит_для:
      - ЖК эконом / комфорт / бизнес (аккредитованные в Сбере)
      - апарт-комплексы с ипотечными программами
      - объекты с семейной / IT-ипотекой и господдержкой
    не_подходит_для:
      - объекты без аккредитации в Сбере
      - элит без ипотечного спроса (покупка за наличные / альтернатива)
      - чистый brand-охват (площадка про сделку, а не про узнаваемость)
    форматы:
      - карточка ЖК в каталоге новостроек Домклик
      - продвижение в выдаче и подбор по ипотечному калькулятору
      - лид из заявки на ипотеку → передача в отдел продаж
    бенчмарки_2026:
      CPL_ипотечный_ЖК_комфорт:
        значение: "нет надёжного публичного диапазона — нужен пилот"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "Домклик стоимость лида новостройка комфорт 2026 застройщик аккредитация"
      доля_ипотечных_сделок_первичка:
        значение: "высокая на эскроу/ДДУ, но точную долю по проекту считать по факту"
        тип_источника: hypothesis
        статус_токен: "[◐ гипотеза → A/B]"
        запрос: "доля ипотечных сделок первичка ДДУ 2026 семейная IT-ипотека"
      дата_актуализации: 2026-04-28
      примечание_прохора: >
        Публичных устойчивых CPL по Домклику мало — площадка завязана на банк, а не на
        открытый рекламный аукцион. Не выдумываю число: ставлю «нужен пилот» и беру факт
        из первой волны заявок. Зато это горячий ипотечный лид — он уже считает ставку.
    особенности_модерации:
      запрещено:
        - указание ипотечной ставки без привязки к банку и условиям программы
        - «апартаменты = квартира» — апарты юридически нежилое, ипотека и условия иные
        - цена и платёж без проектной декларации
      требуется:
        - аккредитация объекта в Сбере (без неё канала нет)
        - корректное указание программы (семейная / IT / господдержка) и её условий
        - маркировка ОРД, erid для продвигаемых форматов
    типовые_креативные_углы:
      - ежемесячный платёж по семейной / IT-ипотеке (с условиями программы)
      - первоначальный взнос и сценарий одобрения
      - продажи по ДДУ через эскроу — безопасность сделки
      - калькулятор: «сколько в месяц за студию 24 м²»
    комментарий_прохора: >
      Канал нижней воронки и конверсии: сюда приходит покупатель, который УЖЕ выбирает
      ипотеку. Помни про лаг длинной сделки — одобрение ипотеки это узкое место на 5–15
      дней, не убивай канал по лидам первой недели, лид дозревает в сделку медленно.
      Завязан на аккредитацию: нет Сбера — нет Домклика.

  # ============================================================
  # 4. ЯНДЕКС НЕДВИЖИМОСТЬ
  # ============================================================
  - channel_id: yandex_realty
    название: Яндекс Недвижимость
    категория: classified
    этапы_воронки: [вовлечение, лидген, конверсия]
    подходит_для:
      - ЖК эконом / комфорт / бизнес / премиум
      - апарт-комплексы и сервисные апартаменты
      - объекты с упором на ипотеку (связка с экосистемой Яндекса)
    не_подходит_для:
      - ТРЦ и чистый лизинг коммерческих площадей
      - склады (слабая профильная аудитория)
      - холодная brand-узнаваемость без поискового спроса
    форматы:
      - карточка ЖК в каталоге новостроек
      - продвижение / приоритет в выдаче
      - интеграция с Яндекс.Картами и поиском
    бенчмарки_2026:
      CPL_ЖК_комфорт_СПб:
        значение: "2000–5000 ₽ (как ориентир уровня Циан, требует сверки)"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "Яндекс Недвижимость CPL ЖК комфорт СПб 2026 стоимость лида"
      дата_актуализации: 2026-04-28
      примечание_прохора: >
        Диапазон ставлю по аналогии с другими классифайдами того же класса — это не
        замер, это ориентир со статусом «требует подтверждения». Перед бюджетом гоню
        живой WebSearch и сверяю с отделом продаж по факту первых лидов.
    особенности_модерации:
      запрещено:
        - обещания доходности и роста цены (особенно апарты)
        - цена / ипотека без проектной декларации и условий банка
        - «лучший / №1» без подтверждения
      требуется:
        - проектная декларация и разрешение на строительство
        - юрлицо застройщика и ОГРН
        - маркировка ОРД, erid
    типовые_креативные_углы:
      - связка с Картами: «12 минут пешком до метро» на карте
      - квартирография и фильтр по метражу/бюджету
      - ход строительства и срок сдачи
      - ипотечные программы внутри экосистемы
    комментарий_прохора: >
      Сильна связкой с Картами и поиском Яндекса — покупатель видит объект в контексте
      «где это и как добираться». Для жилки СПб/Москвы держим в миксе вместе с Циан, не
      вместо. По числам тут особенно дисциплина: ставлю △, пока не сверю живьём.

  # ============================================================
  # 5. ДОМ.РФ — классифайды / витрина
  # ============================================================
  - channel_id: domrf_classified
    название: ДОМ.РФ — классифайды и витрина новостроек
    категория: classified
    этапы_воронки: [вовлечение, лидген]
    подходит_для:
      - ЖК эконом / комфорт с господдержкой и льготной ипотекой
      - объекты под семейную ипотеку и программы развития территорий
    не_подходит_для:
      - элит и премиум без ипотечного спроса
      - коммерция (ТРЦ, БЦ, склады)
      - чистый brand-охват
    бенчмарки_2026:
      CPL_льготная_ипотека:
        значение: "нет устойчивого публичного бенчмарка — нужен пилот"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "ДОМ.РФ классифайд новостройки стоимость лида 2026 застройщик льготная ипотека"
      дата_актуализации: 2026-04-28
      примечание_прохора: >
        Это скорее государственно-инфраструктурная витрина, чем открытый рекламный
        аукцион — рыночного CPL по ней почти нет. Не сочиняю: пишу «нужен пилот».
        Ценность канала не в дешёвом трафике, а в связке с госпрограммами и доверии.
    особенности_модерации:
      запрещено:
        - искажение условий господдержки и льготных ставок
        - обещания доходности по апартам
        - цена / ставка без актуальных условий программы
      требуется:
        - соответствие объекта условиям госпрограмм (аккредитация)
        - проектная декларация, юрлицо застройщика
        - маркировка ОРД, erid
    типовые_креативные_углы:
      - семейная ипотека и господдержка как главный мотив
      - надёжность и эскроу-защита сделки
      - доступность входа для молодой семьи
    комментарий_прохора: >
      Нишевый канал под объекты с госпрограммами. Не ждём от него вала лидов — ждём
      качественную, «доверительную» аудиторию под льготную ипотеку. В медиа-миксе
      жилого эконома/комфорта держим как дополнение, не как опору.

  # ============================================================
  # 6. 2GIS — реклама в справочнике и на карте
  # ============================================================
  - channel_id: gis_2gis
    название: 2GIS — реклама в справочнике и на карте
    категория: classified
    этапы_воронки: [узнаваемость, вовлечение, лидген]
    подходит_для:
      - ЖК всех классов (приоритет в локальной выдаче и на карте)
      - апарт-комплексы и апарт-отели
      - стрит-ритейл и коммерческие помещения (локальный поиск)
      - ТРЦ и районные ТЦ (как точка на карте, навигация трафика)
    не_подходит_для:
      - федеральный brand-охват (2GIS про локальный, гео-привязанный спрос)
      - склады вне логистических кластеров
    форматы:
      - приоритетное размещение / выделение точки на карте
      - рекламная карточка организации (отдел продаж, шоурум)
      - баннер в категории и при построении маршрута
    бенчмарки_2026:
      стоимость_размещения_месяц:
        значение: "зависит от города и категории — диапазон уточнять по тарифам 2GIS"
        тип_источника: web-search
        статус_токен: "[△ требует подтверждения]"
        запрос: "2GIS реклама стоимость размещение организация 2026 тарифы город"
      дата_актуализации: 2026-04-28
      примечание_прохора: >
        2GIS продаёт не лиды, а видимость в локальном поиске и на маршруте — мерить
        его по CPL некорректно. Числа по тарифам беру живым WebSearch под город, не
        выдумываю; ценность считаю по визитам в шоурум и звонкам с карты.
    особенности_модерации:
      запрещено:
        - неактуальный адрес / время работы отдела продаж
        - обещания доходности и роста цены
      требуется:
        - корректная карточка организации (адрес шоурума, контакты)
        - юрлицо застройщика
        - маркировка ОРД, erid для рекламных форматов
    типовые_креативные_углы:
      - «отдел продаж на месте» — точка на карте у объекта
      - маршрут до шоурума и до метро от ЖК
      - локальная инфраструктура вокруг квартала
    комментарий_прохора: >
      Канал локального присутствия: помогает горячему покупателю физически дойти до
      шоурума. Особенно полезен под объект со своим офисом продаж на площадке. В миксе —
      нижняя воронка и навигация, не охватный канал.

