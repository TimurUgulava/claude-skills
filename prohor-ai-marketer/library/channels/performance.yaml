# Библиотека каналов Прохора — категория: performance
#
# Назначение: Прохор не выдумывает каналы — он подбирает их из этой библиотеки.
# Каждая карточка — канонической схемы (см. CHANNELS_LIBRARY_DRAFT.md).
#
# Анти-галлюцинационный контракт (ядро доверия):
#   Каждое число несёт объект {значение, тип_источника, ссылка_или_запрос, дата, статус}.
#   Статусы бенчмарков в этом файле:
#     - "требует актуализации через WebSearch" — диапазон взят из открытых кейсов/тарифов
#       на дату актуализации; перед выдачей клиенту Прохор обновляет его живым WebSearch.
#     - "гипотеза для A/B" — ориентир под пилот, не факт.
#   Источник по каждому каналу — verified-library (эта карточка) + web-search (актуализация).
#   Нет надёжных данных → пишем "нет надёжных данных, нужен пилот", число не выдаём.
#
# Важно: поле не_подходит_для важнее, чем подходит_для — оно спасает от провального канала.

channels:

  # ============================================================
  # 1. Яндекс.Директ — Поиск
  # ============================================================
  - channel_id: yandex_direct_search
    название: Яндекс.Директ — Поиск
    категория: performance
    этапы_воронки: [лидген, конверсия, ремаркетинг]
    подходит_для:
      - ЖК эконом / комфорт / бизнес (сформированный спрос «куплю квартиру в районе»)
      - апарт-комплексы и сервисные апартаменты
      - стрит-ритейл первых этажей (аренда/продажа помещения)
      - горячие запросы по конкретному ЖК и району
    не_подходит_для:
      - первичная узнаваемость на холодную ЦА (нет спроса = нет показов)
      - продукт без сформированного спроса (новый формат, который надо объяснять)
      - чистый brand-разогрев перед стартом продаж (это РСЯ/DOOH, не Поиск)
    форматы:
      - текстово-графические объявления: заголовок 56 + 30 знаков, текст до 81 знака, до 8 быстрых ссылок
      - динамические объявления: автогенерация под большой пул лотов из фида
      - быстрые ссылки и уточнения (расширения под планировки/ипотеку/акции)
    бенчмарки_2026:
      CPC_ЖК_комфорт:
        значение: "80–180 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPC Яндекс Директ Поиск ЖК комфорт-класс 2026 СПб кейс'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      CPL_ЖК_комфорт:
        значение: "1500–4500 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPL заявка Яндекс Директ новостройка комфорт 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      CPC_апарты:
        значение: "100–250 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPC Яндекс Директ апартаменты инвестиции 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      доля_горячего_трафика_в_лидах:
        значение: "выше, чем у РСЯ при том же бюджете"
        тип_источника: hypothesis
        ссылка_или_запрос: "наблюдение библиотеки, проверяется сплитом Поиск vs РСЯ"
        дата_актуализации: 2026-04-28
        статус: гипотеза для A/B
    особенности_модерации:
      запрещено:
        - гарантии доходности и прироста стоимости («заработай на перепродаже», «+30% к сдаче»)
        - превосходные степени без подтверждения («лучший ЖК», «№1 в районе»)
        - сравнение с конкретными конкурентами по названию
        - цена/ипотечная ставка без указания условий, банка и периода действия
      требуется:
        - название юрлица застройщика и ОГРН в объявлении/на посадочной
        - проектная декларация на сайте при упоминании цены и сроков
        - пометка «реклама», данные рекламодателя, маркировка ОРД (erid)
    типовые_креативные_углы:
      - время до метро / центра одной строкой («12 минут до Беговой»)
      - цена за м² и позиционирование внутри класса
      - срок сдачи и стадия готовности корпуса
      - ипотечные программы (семейная, IT) и рассрочка — с условиями
    комментарий_прохора: >
      Базовый станок лидгена для жилья эконом/комфорт. Ловит горячий спрос — человек уже
      вбил «купить квартиру у Финского залива», осталось не профукать его на посадочной.
      Для премиума Поиск работает слабее: там запросов мало, бренд решает больше, чем
      ставка за клик. И не вешай на Поиск задачу разогрева холодной ЦА — это не его работа,
      на нём ты платишь за намерение, а не за знакомство.

  # ============================================================
  # 2. Яндекс.Директ — РСЯ (Рекламная сеть Яндекса)
  # ============================================================
  - channel_id: yandex_direct_rsya
    название: Яндекс.Директ — РСЯ (Рекламная сеть Яндекса)
    категория: performance
    этапы_воронки: [охват, вовлечение, лидген, ремаркетинг]
    подходит_для:
      - ЖК всех классов (особенно brand-разогрев перед стартом и ремаркетинг)
      - апарт-комплексы (догрев инвестора по сайтам недвижимости/финансов)
      - ТРЦ (охват по геоинтересам в радиусе)
      - ремаркетинг на тех, кто был на сайте, но не оставил заявку
    не_подходит_для:
      - срочный лидген с жёстким CPL без накопленной аудитории и креативного запаса
      - узкий B2B (склады, БЦ класса A) — аудитория размывается, дорого и неточно
    форматы:
      - текстово-графические объявления (показ на площадках-партнёрах)
      - графические баннеры: 240x400, 300x250, 300x600, 728x90, 970x250 и др.
      - смарт-баннеры по фиду лотов
      - видеодополнения и медийные форматы
    бенчмарки_2026:
      CPM_ЖК_комфорт:
        значение: "90–300 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPM РСЯ медийка недвижимость 2026 бенчмарк'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      CPC_ЖК_комфорт:
        значение: "30–90 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPC РСЯ ЖК комфорт 2026 кейс'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      CPL_ЖК_комфорт:
        значение: "2000–6000 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPL заявка РСЯ новостройка 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      примечание:
        значение: "лид из РСЯ дешевле по клику, но «холоднее» — длиннее путь до брони (см. library/funnels.yaml)"
        тип_источника: object-claim
        ссылка_или_запрос: "правило библиотеки: не убивать РСЯ по лидам первых 2 недель"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
    особенности_модерации:
      запрещено:
        - гарантии доходности и прироста стоимости
        - агрессивный кликбейт и шок-контент в баннере
        - вводящие в заблуждение элементы интерфейса (фейк-кнопки, поддельные уведомления)
        - цена без условий и проектной декларации
      требуется:
        - данные юрлица и ОГРН на посадочной
        - маркировка ОРД (erid) на каждом креативе
        - корректные размеры и вес баннеров под требования сети
    типовые_креативные_углы:
      - атмосфера локации (вид на залив, набережная, двор без машин) — РСЯ любит картинку
      - «следишь за стройкой?» — ремаркетинг на ход строительства
      - спецусловие/акция с дедлайном (мягко, без запугивания)
      - смарт-баннер с конкретными планировками под интерес пользователя
    комментарий_прохора: >
      РСЯ — это охват и догрев, а не горячий лидген. Тут ты показываешься тому, кто
      ещё думает, и ремаркетишь того, кто ушёл с сайта. Главная ошибка девелопера —
      смотреть на CPL РСЯ в первую неделю и кричать «канал не работает». Сделка длинная,
      бренд дозревает через касания — режь по факту брони за 1–2 месяца, а не по заявкам
      за понедельник. Картинка тут решает: РСЯ прощает слабый текст, но не прощает серый баннер.

  # ============================================================
  # 3. Яндекс.Директ — Мастер кампаний
  # ============================================================
  - channel_id: yandex_direct_master
    название: Яндекс.Директ — Мастер кампаний
    категория: performance
    этапы_воронки: [лидген, конверсия]
    подходит_для:
      - быстрый старт при ограниченном ресурсе и без отдельного медиабайера
      - небольшие застройщики и единичные объекты (1 ЖК, пул апартов)
      - тест ниши/локации с малым бюджетом до полноценной ручной кампании
    не_подходит_для:
      - тонкая ручная оптимизация на крупном бюджете (мало контроля над размещениями)
      - сложная сегментная стратегия с разными офферами под сегменты ЦА
      - премиум/элит, где важен каждый показ и точность площадок
    форматы:
      - комбинированное объявление (Поиск + РСЯ автоматически)
      - несколько заголовков и текстов на ротации (система сама подбирает связки)
      - изображения и быстрые ссылки в одном объекте
    бенчмарки_2026:
      CPL_ЖК_комфорт:
        значение: "1800–5000 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPL Мастер кампаний Яндекс Директ недвижимость 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      минимальный_недельный_бюджет_ориентир:
        значение: "от ~300 ₽/день рекомендованного, рабочий старт обычно выше"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'минимальный бюджет Мастер кампаний 2026 рекомендации'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      стабильность_CPL:
        значение: "выше разброс, чем у ручного Поиска — автоматика учится на старте"
        тип_источника: hypothesis
        ссылка_или_запрос: "проверяется сравнением Мастер vs ручной Поиск на одном объекте"
        дата_актуализации: 2026-04-28
        статус: гипотеза для A/B
    особенности_модерации:
      запрещено:
        - гарантии доходности и прироста стоимости
        - превосходные степени без подтверждения
        - цена/ставка без условий и декларации
      требуется:
        - юрлицо и ОГРН, проектная декларация на посадочной
        - маркировка ОРД (erid)
    типовые_креативные_углы:
      - максимально широкий набор заголовков под автоподбор (дай системе материал)
      - ключевая выгода + локация + срок сдачи в разных комбинациях
      - оффер с понятным действием (записаться на просмотр, узнать цену)
    комментарий_прохора: >
      Мастер кампаний — это «запустить за вечер без байера». Хорош как тест локации или
      для небольшого застройщика, у которого нет отдельного человека на Директ. Платишь
      за это контролем: система сама решает, где показываться, и на старте откровенно
      учится за твой счёт. На серьёзном бюджете и многосегментной стратегии я тебя отсюда
      выведу на ручные кампании — но как точка входа и быстрый тест он честно делает работу.

  # ============================================================
  # 4. Google Ads (Search + Display)
  # ============================================================
  - channel_id: google_ads
    название: Google Ads (Search + Display)
    категория: performance
    этапы_воронки: [лидген, конверсия, ремаркетинг, охват]
    применимость_РФ:
      статус: ограничено
      пояснение: >
        С 2022 года таргетированный показ рекламы Google Ads на аудиторию в РФ
        фактически недоступен (приостановка рекламных продуктов Google в России).
        Канал держим в библиотеке для: (1) экспортных/трансграничных проектов и продаж
        зарубежной аудитории, (2) русскоязычной диаспоры, (3) сценариев, где статус Google
        в РФ изменится. Перед включением в медиа-микс под РФ-объект — обязательная проверка
        актуального статуса через WebSearch. По умолчанию для РФ-кампании НЕ предлагается.
    подходит_для:
      - продажа объектов зарубежной/диаспорной аудитории (экспортный спрос)
      - проекты на международных рынках вне РФ
      - сценарий «статус Google в РФ изменился» (проверять через WebSearch)
    не_подходит_для:
      - стандартная кампания под аудиторию внутри РФ (показы недоступны)
      - быстрый локальный лидген по российскому ЖК
    форматы:
      - Search: текстовые объявления (заголовки 30 знаков ×3, описания 90 знаков ×2)
      - Display: адаптивные медийные баннеры, GDN-сеть
      - Performance Max (при доступности рынка)
    бенчмарки_2026:
      статус_данных:
        значение: "нет надёжных данных по РФ-аудитории — канал в РФ не работает"
        тип_источника: object-claim
        ссылка_или_запрос: "WebSearch: 'статус рекламы Google Ads в России 2026'"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
      CPC_зарубеж_русскоязычный_сегмент:
        значение: "сильно зависит от страны/гео — без пилота не оцениваем"
        тип_источника: object-claim
        ссылка_или_запрос: "WebSearch: 'Google Ads real estate CPC 2026 [страна показа]'"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
    особенности_модерации:
      запрещено:
        - misleading claims о доходности и гарантированном росте цены
        - превосходные степени без доказательств
        - нарушение housing-политик Google (дискриминация в таргетинге жилья)
      требуется:
        - верификация рекламодателя (advertiser identity verification)
        - соответствие локальному рекламному законодательству страны показа
    типовые_креативные_углы:
      - инвестиционная локация для зарубежного покупателя (без обещаний доходности)
      - ВНЖ/релокация-контекст (где это легально для рынка показа)
      - английский/локальный язык под рынок
    комментарий_прохора: >
      Честно: под обычный российский ЖК это сейчас мёртвый канал — Google в РФ рекламу
      не крутит. Держу карточку, чтобы ты не наступал на грабли «а давайте ещё Гугл
      добавим» и не закладывал в план бюджет, который физически не открутится. Живой
      смысл Google Ads у нас один — если продаёшь зарубежной или диаспорной аудитории.
      Перед тем как вписать его в микс, я лезу в WebSearch и проверяю актуальный статус —
      на слово «вроде заработало» я канал в план не ставлю.

  # ============================================================
  # 5. VK Ads (performance, lead-форма)
  # ============================================================
  - channel_id: vk_ads_performance
    название: VK Ads — performance (lead-форма)
    категория: performance
    этапы_воронки: [охват, вовлечение, лидген, ремаркетинг]
    подходит_для:
      - ЖК эконом / комфорт (массовый жилой спрос)
      - апарт-комплексы для широкой аудитории
      - ТРЦ (трафик посетителей по геотаргету)
      - гостиницы массового сегмента
    не_подходит_для:
      - элит/премиум (ядро ЦА мало представлено и плохо ловится таргетом)
      - чистый B2B (БЦ класса A, склады) — деловой ЛПР тут вне рабочего контекста
    форматы:
      - lead-форма внутри VK (заявка без перехода на сайт — короче путь, дешевле лид)
      - универсальная запись / рекламная запись с кнопкой
      - карусель (несколько планировок/видов в одном объекте)
      - клипы и видеоформаты
    бенчмарки_2026:
      CPM:
        значение: "150–400 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPM VK Ads недвижимость 2026 бенчмарк'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      CPL_ЖК_комфорт_лидформа:
        значение: "1200–3500 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPL лид-форма VK Ads новостройка комфорт 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      CTR:
        значение: "0.7–1.5%"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CTR VK Ads недвижимость 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      качество_лида_из_лидформы:
        значение: "ниже, чем с сайта — короткий путь даёт больше «холодных», нужна квалификация"
        тип_источника: hypothesis
        ссылка_или_запрос: "проверяется сравнением конверсии лидформа vs сайт в бронь"
        дата_актуализации: 2026-04-28
        статус: гипотеза для A/B
    особенности_модерации:
      запрещено:
        - персональные обращения («вам положена ипотека», «вы искали квартиру»)
        - запугивание и искусственная срочность («успей, пока не подорожало»)
        - намёк на инвестиционную выгоду без проектной декларации
        - цена/ставка без условий
      требуется:
        - возрастная маркировка
        - маркировка ОРД (erid)
        - данные рекламодателя
    типовые_креативные_углы:
      - семейный сценарий для комфорта (двор без машин, школа рядом, евро-планировка)
      - «снимаешь vs покупаешь» — арифметика платежа vs аренды
      - готовность дома + понятный следующий шаг
      - геотаргет-оффер для ТРЦ (акция, событие выходного дня)
    комментарий_прохора: >
      VK Ads — рабочая лошадка массового жилья. Лид-форма даёт самый короткий путь до
      заявки и дешёвый лид, но не обольщайся цифрой CPL: половина — «просто посмотреть».
      Поэтому квалификация на стороне отдела продаж обязательна, иначе будешь хвалиться
      дешёвым лидом и недоумевать, почему нет броней. Для элита сюда не лезь — ядра ЦА
      тут просто нет, спалишь бюджет на охват не тех людей.

