      - короткие посты в ленте Дзена
      - видео и вертикальные ролики
      - продвижение публикаций через рекламный кабинет Дзена
    бенчмарки_2026:
      CPM_продвижение: "[△ требует подтверждения] — сверить тариф через WebSearch"
      дочитываемость_лонгрида: "нет отраслевого норматива по недвижимости — мерить по своим публикациям [△ требует подтверждения]"
      стоимость_дочитывания: "[◐ гипотеза → A/B]"
      источник: >
        WebSearch на момент сессии (тарифы и метрики Дзена для бизнес-аккаунтов,
        кейсы контент-маркетинга в недвижимости)
      дата_актуализации: 2026-06-04
      статус_данных: "[△] кэш-якорь, требует актуализации"
    особенности_модерации:
      запрещено:
        - кликбейт-заголовки, не подтверждённые телом статьи (режет показы)
        - обещания доходности/прироста цены (214-ФЗ)
        - выдача AI-рендеров за фото объекта без метки
      требуется:
        - метка [▢ AI-визуализация] на сгенерированных изображениях
        - маркировка ОРД на продвигаемых рекламных материалах
        - корректное разграничение апартаменты ≠ квартира в апарт-материалах
    типовые_креативные_углы:
      - гайд «как выбрать квартиру у воды и не переплатить за вид»
      - разбор района как места для жизни (инфраструктура, транспорт, среда)
      - сценарии жизни в евро-планировке (семья, пара, удалёнка)
      - "честный разбор «апартаменты vs квартира»: для кого и почему"
    комментарий_прохора: >
      Дзен — это длинный прогрев через пользу, а не лидоруб. Беру под комфорт/бизнес и
      загород, где решение зреет и человеку нужен контент «помоги выбрать». Заголовок-кликбейт
      без подтверждения телом — площадка сама режет показы, так что честность здесь ещё и
      технически выгодна. Дочитываемость меряю по своим публикациям, отраслевой норматив не
      выдумываю.

  # ─────────────────────────────────────────────────────────────────────
  - channel_id: influence_realty
    название: Инфлюенс-маркетинг (TG-каналы недвижимости, YouTube, VK-блогеры)
    категория: social
    этапы_воронки: [узнаваемость, охват, вовлечение, прогрев]
    подходит_для:
      - ЖК комфорт / бизнес / премиум (обзоры и рум-туры у профильных блогеров)
      - апарт-комплексы (инвест-блогеры — строго без обещаний доходности)
      - коттеджные посёлки / ИЖС (lifestyle и «переезд за город»)
      - гостиницы и апарт-отели (travel- и city-блогеры)
    не_подходит_для:
      - склады / light industrial (нет адекватного инфлюенс-поля)
      - сценарии, где нужен жёсткий контроль формулировок (риск 214-ФЗ у блогера высок)
      - совсем малый бюджет (профильные интеграции дороги, а нишевые — мелкий охват)
    форматы:
      - рум-тур / обзор ЖК на YouTube или в Reels/Клипах
      - нативная интеграция в TG-канале по недвижимости (пост/серия постов)
      - инвест-разбор у профильного блогера (под строгим юрфильтром)
      - совместный прямой эфир с экспертом по локации
    бенчмарки_2026:
      CPV_youtube_обзор: "[△ требует подтверждения] — зависит от блогера, фикс или CPM"
      стоимость_интеграции_TG_канал_недвижимости: "сильный разброс по охвату — запрашивать прайс точечно [△ требует подтверждения]"
      конверсия_в_заявку: "не нормируется, мерить по промокоду/UTM [◐ гипотеза → A/B]"
      источник: >
        WebSearch на момент сессии (открытые прайсы бирж инфлюенсеров, кейсы интеграций
        в недвижимости) + прямой запрос медиакита у блогера
      дата_актуализации: 2026-06-04
      статус_данных: "[△] прайсы точечные, единый норматив не выдаём"
    особенности_модерации:
      запрещено:
        - блогер обещает доходность/гарантированный рост цены (214-ФЗ — риск на застройщике тоже)
        - интеграция без маркировки рекламы (ОРД + erid)
        - подача рендеров и AI-визуалов как реальных кадров объекта
      требуется:
        - согласование сценария/тезисов до съёмки (юрфильтр на стороне застройщика)
        - маркировка рекламы у блогера (ОРД + erid) и фиксация в договоре
        - метка «AI-визуализация» на любых сгенерированных кадрах в интеграции
        - UTM/промокод для атрибуции
    типовые_креативные_углы:
      - "честный рум-тур: что реально получаешь за метр в этой локации"
      - «инвест-разбор» через ликвидность локации и аренду, без слова «доходность»
      - сравнение районов глазами местного эксперта-блогера
      - история переезда/новоселья как социальное доказательство
    комментарий_прохора: >
      Инфлюенс работает, но это самый юридически скользкий канал: блогер ляпнет «доходность
      14%» в кадре — отвечать будет в том числе застройщик. Поэтому без согласованного
      сценария и erid не запускаю. Профильные TG-каналы недвижимости часто дают тёплее
      охват, чем YouTube, при меньшем бюджете. Единый прайс не нормирую — запрашиваю медиакит
      точечно, атрибутирую через промокод. Инвест-углы только через ликвидность локации.

  # ─────────────────────────────────────────────────────────────────────
  - channel_id: messenger_marketing
    название: Мессенджер-маркетинг (WhatsApp Business, Telegram-бот ЖК)
    категория: social
    этапы_воронки: [квалификация, вовлечение, конверсия, ремаркетинг, удержание]
    подходит_для:
      - ЖК всех классов (бот ЖК как точка заявки и подбора лота)
      - апарт-комплексы (квалификация инвест- vs lifestyle-запроса)
      - гостиницы и апарт-отели (прямые брони, подтверждения)
      - БЦ / стрит-ритейл (заявки на аренду площадей) [ранний контур]
    не_подходит_для:
      - верхушка воронки / холодный охват (мессенджер — про тёплый контакт, не про reach)
      - массовые несогласованные рассылки (риск блокировки и спам-жалоб)
    форматы:
      - "Telegram-бот ЖК: подбор по параметрам, расчёт ипотеки, запись на показ/ВКС"
      - "WhatsApp Business: ответы менеджера, статусы сделки, напоминания"
      - триггерные сценарии бота (бросил подбор → дожим, ждёт одобрения ипотеки → касание)
      - рассылка по согласованной базе подписчиков бота (не холодная)
    бенчмарки_2026:
      открываемость_бот_рассылки: "обычно выше e-mail, но точное число не нормируем — мерить по своей базе [△ требует подтверждения]"
      доля_квалифицированных_заявок_из_бота: "[◐ гипотеза → A/B]"
      стоимость_сценария_внедрения: "зависит от платформы (конструктор vs кастом) — оценивать по проекту [△ требует подтверждения]"
      источник: >
        WebSearch на момент сессии (бенчмарки чат-ботов в недвижимости, тарифы платформ
        WhatsApp Business API) + собственная аналитика бота
      дата_актуализации: 2026-06-04
      статус_данных: "[△] числа по своей базе, не выдавать как рыночный норматив"
    особенности_модерации:
      запрещено:
        - холодные несогласованные рассылки по купленным базам (спам, нарушение 152-ФЗ о ПД)
        - обещания доходности/прироста цены в автосценариях (214-ФЗ)
        - автоответы с ценой/ипотекой без актуальной декларации и условий банка
      требуется:
        - явное согласие на получение сообщений (opt-in, 152-ФЗ о персональных данных)
        - возможность отписки в каждом касании
        - юрлицо/ОГРН застройщика в коммуникации
        - метка «AI-визуализация» на рендерах, если бот их присылает
    типовые_креативные_углы:
      - мгновенный подбор лота под бюджет и сценарий (бот вместо ожидания менеджера)
      - "точки дожима на длинной сделке: «думает» → кейс, «ждёт одобрения» → поддержка"
      - расчёт ипотеки в боте (семейная / IT) без обещания одобрения
      - напоминание о брони и статусе ДДУ/эскроу как сервис, не как давление
    комментарий_прохора: >
      Мессенджеры — это дно воронки и сервис на длинной сделке, а не охват. Бот ЖК снимает
      нагрузку с ОП на первом касании и квалифицирует запрос: инвестор это или семья — и
      дальше пайплайн разводит их по разным сценариям. Узкое место первички — лаг одобрения
      ипотеки 5–15 дней (см. funnels.yaml): именно сюда ставлю триггерные касания, чтобы не
      терять «ждущих». Холодные рассылки по купленным базам не делаю — это 152-ФЗ и репутация.

  # ─────────────────────────────────────────────────────────────────────
  - channel_id: email_database
    название: E-mail рассылки по согласованным базам
    категория: social
    этапы_воронки: [прогрев, ремаркетинг, удержание, реактивация]
    подходит_для:
      - ЖК комфорт / бизнес / премиум (прогрев собственной базы интересантов)
      - апарт-комплексы (нюрчер-цепочки под длинный цикл инвест-решения)
      - БЦ / коммерция (B2B-рассылки по базе арендаторов) [ранний контур]
      - гостиницы и апарт-отели (лояльность, повторные брони)
    не_подходит_для:
      - привлечение новой холодной ЦА (e-mail — для своей базы, не для reach)
      - сегменты, где ЦА не пользуется почтой (молодёжь-эконом — туда мессенджеры)
      - быстрый лидген (письмо греет, конверсию даёт связка с performance/ОП)
    форматы:
      - триггерные цепочки (welcome, брошенный подбор, дожим перед стартом очереди)
      - "регулярный дайджест: ход стройки, новые лоты, изменения в линейке"
      - персональные подборки лотов под параметры из CRM
      - реактивация «спящей» базы перед запуском новой очереди
    бенчмарки_2026:
      open_rate_недвижимость: "ориентир ~15–30%, но сильно зависит от качества базы — мерить по своей [△ требует подтверждения]"
      CTR_письма: "[◐ гипотеза → A/B]"
      стоимость_контакта: "низкая при своей базе; ноль смысла на покупной [△ требует подтверждения]"
      источник: >
        WebSearch на момент сессии (отраслевые бенчмарки e-mail в недвижимости/девелопменте,
        отчёты ESP-платформ) + собственная статистика рассылок
      дата_актуализации: 2026-06-04
      статус_данных: "[△] open rate сильно зависит от базы, норматив не выдаём"
    особенности_модерации:
      запрещено:
        - рассылка по купленным/несогласованным базам (152-ФЗ о ПД, спам-репутация)
        - обещания доходности/прироста цены в письмах (214-ФЗ, особенно апарты)
        - цена и ипотека без проектной декларации и условий банка
      требуется:
        - подтверждённый opt-in и видимая ссылка отписки (152-ФЗ, требования ESP)
        - маркировка рекламы при необходимости (ОРД для рекламных рассылок)
        - метка «AI-визуализация» на сгенерированных изображениях в письме
        - юрлицо/ОГРН и контакты застройщика в подвале письма
    типовые_креативные_углы:
      - персональная подборка лотов под бюджет и сценарий из CRM
      - "«ваша очередь стартует»: эксклюзивный доступ к ценам для базы"
      - дайджест хода стройки как доказательство темпа и снятие тревоги дольщика
      - "реактивация: «вы смотрели студии — вот что появилось в новой очереди»"
    комментарий_прохора: >
      E-mail в недвижимости — это работа со СВОЕЙ базой, а не канал привлечения. На длинном
      цикле триггерные цепочки догревают тех, кто «думает», и реактивируют спящих перед
      стартом очереди — дёшево и управляемо. Покупные базы не трогаю: это 152-ФЗ, спам-флаги
      и слитая репутация домена. Open rate по нише не нормирую — он живёт от качества базы,
      меряю по факту. Связываю с CRM и мессенджерами: письмо греет, заявку дожимает бот или ОП.
