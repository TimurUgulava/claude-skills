      - коттеджные посёлки / ИЖС (контент про «жизнь за городом»)
      - гостиницы и апарт-отели (контент про локацию и впечатления)
    не_подходит_для:
      - срочный лидген (Дзен — прогрев и охват, не перформанс)
      - элит-недвижимость (формат массового читателя не совпадает с ЦА)
      - склады / чистый B2B
    форматы:
