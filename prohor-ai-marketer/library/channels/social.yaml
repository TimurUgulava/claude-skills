# Библиотека каналов Прохора — категория SOCIAL / мессенджеры
# Соцсети, инфлюенс, SMM-органика, мессенджер-маркетинг, e-mail.
#
# Принцип: Прохор НЕ придумывает каналы — он подбирает из этой библиотеки.
# Каждый бенчмарк = объект со статусом и источником (ядро доверия SKILL.md):
#   [✓ источник]            — verified / web-search, есть ссылка + дата
#   [◐ гипотеза → A/B]      — рабочая оценка, проверяется тестом
#   [△ требует подтверждения] — собрано из открытых данных, заказчик/пилот сверяет
# Числа без источника НЕ выдаём — пишем "нет надёжных данных, нужен пилот".
# Бенчмарки в этом файле помечены [△] / [◐]: это кэш-якорь под актуализацию
# через WebSearch (references/research-actualization.md), а не финальные факты.
#
# Каноническая схема карточки (едина для всех channels/*.yaml):
#   channel_id, название, категория, этапы_воронки, подходит_для,
#   не_подходит_для, форматы, бенчмарки_2026 (+ источник + дата_актуализации +
#   статус_данных), особенности_модерации (запрещено / требуется),
#   типовые_креативные_углы, комментарий_прохора.
#
# v1 = жильё + апарты. Коммерческие сценарии помечены как ранний контур.

meta:
  категория: social
  версия_файла: "1.0"
  дата_сборки: 2026-06-04
  валюта: RUB
  оговорка_по_числам: >
    Все бенчмарки — кэш-якоря со статусом [△ требует подтверждения] или
    [◐ гипотеза → A/B]. Перед медиапланом Прохор актуализирует ключевые числа
    живым WebSearch и обновляет дата_актуализации в карточке. Год в названии
    блока (бенчмарки_2026) — это разрез данных, а не гарантия свежести.

channels:

  # ─────────────────────────────────────────────────────────────────────
  - channel_id: telegram_ads
    название: Telegram Ads (официальный кабинет, порог входа через реселлеров)
    категория: social
    этапы_воронки: [охват, вовлечение, лидген, ремаркетинг]
    подходит_для:
      - ЖК бизнес / премиум / элит (платёжеспособная ЦА в TG)
      - ЖК комфорт в Москве и СПб
      - апарт-комплексы и сервисные апартаменты (инвест- и lifestyle-аудитория)
      - БЦ класса A (таргет на топ-менеджмент и owner-tenants) [ранний контур]
      - гостиницы и апарт-отели (бронирование, лонг-стей)
    не_подходит_для:
      - склады и light industrial (ЦА закупщиков/логистов не кликает в TG-ленте)
      - ЖК эконом в регионах с малым бюджетом (порог входа и CPM высоки, ядро ЦА в VK)
      - быстрый дешёвый лидген — TG даёт дорогой, но качественный контакт
    форматы:
      - текстовое объявление до 160 знаков (классический формат Telegram Ads)
      - объявление с эмодзи и одной ссылкой на канал/бота/сайт
      - продвижение поста из канала застройщика (boost через кабинет)
      - таргет по тематикам каналов и по конкретным каналам недвижимости
    бенчмарки_2026:
      CPM_таргет_недвижимость: "350–900 ₽ [△ требует подтверждения]"
      CPL_ЖК_бизнес_премиум: "3500–9000 ₽ [◐ гипотеза → A/B]"
      минимальный_бюджет_входа_через_реселлера: "от ~2 € эквивалент CPM, общий вход зависит от агента [△ требует подтверждения]"
      CTR_в_ленту_канала: "0.5–1.2% [◐ гипотеза → A/B]"
      источник: >
        WebSearch на момент сессии (кейсы Sostav / vc.ru по недвижимости в TG Ads,
        открытые тарифы реселлеров) — подтвердить до медиаплана
      дата_актуализации: 2026-06-04
      статус_данных: "[△] кэш-якорь, требует живой актуализации перед бюджетом"
    особенности_модерации:
      запрещено:
        - обещания доходности, гарантированного прироста цены, "инвестиция без риска" (стоп Telegram Ads + 214-ФЗ)
        - призыв к покупке без явного указания продавца/застройщика
        - использование чужих товарных знаков и сравнение с конкретными ЖК по названию
        - нецелевые/кликбейт-формулировки, не относящиеся к продукту
      требуется:
        - указание рекламодателя (юрлицо / ОГРН) в посадочной коммуникации
        - маркировка рекламы ОРД + erid (обязательна для размещения в РФ)
        - корректное юридическое разграничение "апартаменты ≠ квартира" в апарт-кейсах
        - проектная декларация/банк при упоминании цены и ипотечных условий
    типовые_креативные_углы:
      - закрытое предложение для подписчиков канала ЖК (стартовые цены очереди)
      - "сторителлинг хода стройки: стадия монолита → отделка, фотохроника"
      - видовые квартиры на залив/реку как lifestyle-якорь (для премиума и комфорта-вью)
      - ассет-менеджмент от УК для апартов (без слова "доходность" — через ликвидность локации)
    комментарий_прохора: >
      Telegram — это «дорогой контакт за качество». Беру его для бизнеса, премиума и
      апартов, где платёжеспособная аудитория реально живёт в каналах, а не для эконома —
      там ядро в VK. Порог входа выше VK Ads, зато сегментация по тематическим каналам
      недвижимости даёт тёплый трафик. Связку «boost поста застройщика + таргет на каналы
      конкурентов» считаю недооценённой. Числа здесь — якорь под WebSearch, перед бюджетом
      обновляю.

  # ─────────────────────────────────────────────────────────────────────
  - channel_id: vk_ads_social
    название: VK Ads — охватный таргет и социальный лидген
    категория: social
    этапы_воронки: [охват, вовлечение, лидген, ремаркетинг]
    подходит_для:
      - ЖК эконом / комфорт (основное ядро массового жилого спроса)
      - апарт-комплексы массового сегмента
      - ЖК бизнес-класс (широкий охват + ретаргет по look-alike)
      - ТРЦ и районные ТЦ — трафик посетителей по геотаргету [ранний контур]
      - гостиницы массового сегмента и апарт-отели
    не_подходит_для:
      - элит-недвижимость (ядро платёжеспособной ЦА вне VK, выгорает быстро)
      - чистый B2B (склады, БЦ класса A под аренду) — слабая профильная аудитория
    форматы:
      - универсальная запись (текст + медиа + кнопка)
      - карусель (квартирография, планировки, виды)
      - lead-форма внутри VK (без перехода на сайт, ниже трение)
      - клипы / вертикальное видео (охватный формат)
      - продвижение записей сообщества застройщика
    бенчмарки_2026:
      CPM_охват: "180–450 ₽ [△ требует подтверждения]"
      CPL_ЖК_комфорт: "1200–3800 ₽ [◐ гипотеза → A/B]"
      CPL_ЖК_эконом: "800–2500 ₽ [◐ гипотеза → A/B]"
      CTR_универсальная_запись: "0.6–1.4% [◐ гипотеза → A/B]"
      источник: >
        WebSearch на момент сессии (открытые отчёты VK Ads, кейсы Cossa/vc.ru по
        застройщикам) — обязательно сверить локацию и класс объекта
      дата_актуализации: 2026-06-04
      статус_данных: "[△] кэш-якорь, требует живой актуализации перед бюджетом"
    особенности_модерации:
      запрещено:
        - персональные обращения ("вам одобрена ипотека", "вам положена квартира")
        - запугивание срочностью с ценой ("успей, пока не подорожало на N%")
        - намёк на инвестиционную выгоду / доходность без проектной декларации (214-ФЗ)
        - превышение допустимой доли текста на изображении (режет охват, формально не бан)
      требуется:
        - возрастная маркировка при необходимости
        - маркировка ОРД + erid
        - юрлицо/ОГРН застройщика и проектная декларация при упоминании цены
    типовые_креативные_углы:
      - "семейный сценарий: двор без машин, школа и детсады в пешей доступности"
      - "снимаешь vs покупаешь" с ежемесячным платежом по ипотеке (без обещания выгоды)
      - евро-планировки и студии как первое жильё (триггер «свой угол»)
      - готовность очереди + сроки сдачи (стадия монолита — «фиксируешь цену сейчас»)
    комментарий_прохора: >
      VK Ads — рабочая лошадь массового жилья: эконом и комфорт здесь дома. Лид-форма
      внутри VK снижает трение лучше перехода на сайт, но качество лида ниже — компенсирую
      квалификацией. Для ТРЦ силён геотаргет в радиусе квартала. Для элитки не беру:
      ядро ЦА вне площадки, открут пойдёт, конверсия — нет. Этот канал и performance-кабинет
      VK (см. performance.yaml) — разные задачи: здесь охват и социальный сигнал, там
      перформанс-оптимизация; не путать в медиаплане.

  # ─────────────────────────────────────────────────────────────────────
  - channel_id: vk_smm_organic
    название: VK — SMM-органика (сообщество застройщика)
    категория: social
    этапы_воронки: [узнаваемость, вовлечение, прогрев, удержание]
    подходит_для:
      - ЖК эконом / комфорт / бизнес (живое комьюнити дольщиков и интересантов)
      - апарт-комплексы (контент про ассет-менеджмент и эксплуатацию)
      - ТРЦ и районные ТЦ (афиша, акции, события) [ранний контур]
      - гостиницы и апарт-отели (контент про локацию и сервис)
    не_подходит_для:
      - быстрый лидген "здесь и сейчас" — органика дозревает месяцами, не неделями
      - элит-недвижимость (ЦА не строит решение через паблик VK)
      - склады / light industrial (нет социального запроса на контент)
    форматы:
      - посты-хроника стройки (фото/видео с площадки по графику)
      - прямые эфиры и Q&A с отделом продаж
      - клипы VK (вертикаль, охватный органический формат)
      - "закреп с навигацией: квартирография, ход стройки, контакты ОП"
      - UGC и отзывы новосёлов (после сдачи очередей)
    бенчмарки_2026:
      ER_охватный_недвижимость: "нет надёжного отраслевого норматива — мерить по своему сообществу [△ требует подтверждения]"
      типовая_частота_постинга: "3–5 постов/нед как рабочая гипотеза [◐ гипотеза → A/B]"
      стоимость_лида_из_органики: "не атрибутируется напрямую — органика греет, конверсию даёт performance/classified [△ требует подтверждения]"
      источник: >
        WebSearch на момент сессии (бенчмарки ER по нише через Popsters/LiveDune
        при наличии) + собственная аналитика сообщества застройщика
      дата_актуализации: 2026-06-04
      статус_данных: "[△] атрибуция органики условна, числа не выдавать как факт ROI"
    особенности_модерации:
      запрещено:
        - подача AI-рендеров как реальных фото объекта (нужен токен/подпись «AI-визуализация»)
        - обещания доходности и прироста цены в постах про инвест-привлекательность (214-ФЗ)
        - публикация цен без актуальной проектной декларации
      требуется:
        - метка «AI-визуализация» на сгенерированных изображениях [▢ AI-визуализация]
        - маркировка ОРД при размещении рекламных постов (для рекламы, не для органики)
        - дисклеймер про предчистовую/чистовую отделку, если показан интерьер
    типовые_креативные_углы:
      - честная хроника стройки как доказательство темпа (анти-абстракция «строим»)
      - "разбор планировок: евро-двушка vs классика, что выбрать под сценарий жизни"
      - "локация-сериал: набережная, велодорожка, метро в пешей доступности"
      - ответы на барьеры дольщика рубриками (эскроу, ДДУ, сроки, ипотека)
    комментарий_прохора: >
      Органика VK — это не про лиды на этой неделе, а про доверие и прогрев на длинной
      сделке. Сообщество застройщика держит дольщиков и «думающих», снимает барьеры до
      звонка. Главная ловушка — мерить органику по лидам и убивать её через две недели:
      это противоречит логике цикла 3–9 месяцев. Атрибуцию честно ставлю как условную,
      ROI из паблика не считаю числом. И жёстко: рендеры в ленте — только с меткой
      «AI-визуализация», иначе это введение в заблуждение.

  # ─────────────────────────────────────────────────────────────────────
  - channel_id: telegram_smm_organic
    название: Telegram — органический канал ЖК / застройщика
    категория: social
    этапы_воронки: [вовлечение, прогрев, удержание, ремаркетинг]
    подходит_для:
      - ЖК бизнес / премиум / элит (платёжеспособная ЦА читает каналы)
      - апарт-комплексы (инвест-нарратив через ликвидность, не доходность)
      - БЦ класса A (owner-tenant сообщество) [ранний контур]
      - гостиницы и апарт-отели (лояльность, прямые брони)
    не_подходит_для:
      - холодный охват с нуля без посева (TG-канал не растёт органически без трафика)
      - ЖК эконом массового сегмента (ядро ЦА в VK, не в TG-каналах)
      - склады / light industrial
    форматы:
      - текстово-визуальные посты (хроника, разборы, новости проекта)
      - закрытый канал/чат для подписчиков с эксклюзивными стартами очередей
      - голосовые/видеокружки от архитектора или ГИПа (приближение к продукту)
      - связка «канал → бот ЖК» для заявки и подбора лота
    бенчмарки_2026:
      стоимость_подписчика_посевом: "зависит от тематики и города — мерить по факту, не выдавать норматив [△ требует подтверждения]"
      доля_заявок_из_канала_в_боте: "[◐ гипотеза → A/B] — тестировать связку канал→бот"
      источник: >
        WebSearch на момент сессии (биржи посева TG, кейсы по недвижимости) +
        собственная аналитика связки канал→бот
      дата_актуализации: 2026-06-04
      статус_данных: "[△] числа условны, подтверждать пилотом"
    особенности_модерации:
      запрещено:
        - обещания доходности/прироста цены (214-ФЗ, особенно апарты)
        - публикация AI-рендеров без метки «AI-визуализация»
        - цена и ипотека без проектной декларации и банка
      требуется:
        - маркировка ОРД + erid на рекламных постах и посевах
        - метка [▢ AI-визуализация] на сгенерированных изображениях
        - юрлицо/ОГРН в коммуникации про продажу
    типовые_креативные_углы:
      - "инсайдерский тон: «что внутри проекта знают только подписчики»"
      - эксклюзивные старты очередей и брони для аудитории канала
      - экспертные разборы локации и квартирографии от лица команды проекта
      - честные ответы на возражения (эскроу, сроки, апартаменты ≠ квартира)
    комментарий_прохора: >
      TG-канал — это удержание и прогрев тёплых, а не верхушка воронки. Сам по себе он не
      растёт: нужен посев или трафик с performance. Зато на бизнесе и премиуме связка
      «канал → бот ЖК» даёт управляемую заявку без колл-центра на первом касании.
      Органику TG и Telegram Ads держу раздельно: Ads — закупка охвата, канал — актив,
      который дозревает. Доходность апартов в постах не обещаю — закон, и это не обсуждается.

  # ─────────────────────────────────────────────────────────────────────
  - channel_id: dzen_content
    название: Дзен — контент-маркетинг и нативные статьи
    категория: social
    этапы_воронки: [узнаваемость, охват, вовлечение, прогрев]
