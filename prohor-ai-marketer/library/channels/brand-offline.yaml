    особенности_модерации:
      запрещено:
        - гарантии доходности и прироста стоимости (особенно строго для апартов/инвестпродукта — 214-ФЗ / ФАС)
        - "апартаменты = квартира" — юридически некорректно, разделять статусы
        - цена/ставка без проектной декларации и условий банка
      требуется:
        - юрлицо застройщика, проектная декларация при упоминании цены
        - маркировка рекламы и erid (в т.ч. для печатных и онлайн-версий advertorial)
        - корректный правовой статус объекта (апартаменты — нежилое, если это так)
    типовые_креативные_углы:
      - для БЦ: класс здания, локация в деловом кластере, tenant-mix и инфраструктура (ранний контур, v2)
      - для премиум-ЖК: архитектура, видовые характеристики, приватность, статус локации
      - имиджевая статья о девелопере и его портфеле сданного
      - инвест-угол для коммерции — через ликвидность локации и ассет-менеджмент УК, без обещаний доходности
