      - спецвыпуски по недвижимости и инвестициям
      - глянец/lifestyle — для премиум-жилья
    бенчмарки_2026:
      - метрика: стоимость_размещения
        значение: "зависит от издания, формата (полоса/модуль) и тиража"
        тип_источника: web-search
        источник: "WebSearch «реклама деловое издание прайс [издание] 2026» + медиакит издания"
        дата_актуализации: "требует актуализации на момент сессии"
        статус: "цена — из медиакита издания, не из библиотеки"
      - метрика: природа_отдачи
        значение: "имиджевый brand-контакт с B2B/премиум-аудиторией; прямой лидген слабый"
        тип_источника: verified-library
        источник: "характер канала печатной B2B-рекламы"
