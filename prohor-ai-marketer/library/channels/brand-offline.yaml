# Прохор — библиотека каналов: brand / offline
#
# Категория: brand-offline (DOOH, классическая наружка, ТВ, радио, programmatic, печать).
# Назначение: каналы узнаваемости и охвата. Не для точечного лидгена, не для эконома без
# бюджета. Дорогие, длинный лаг отдачи, отдача меряется brand-метриками (knowledge / search
# lift / brand-lead), а не CPL первой недели.
#
# Прохор о категории: это «газ под brand», а не «кран лидов». Берём, когда у проекта есть
# объём, длинный горизонт продаж (3 очереди, котлован-монолит) и задача — впечатать имя ЖК
# в район. Считать ROI brand-канала по лидам первой недели — методически неверно (см.
# стадии воронок в library/funnels.yaml): brand дозревает через performance-ремаркетинг. Эконому и
# точечному догону остатков brand-канал почти всегда не нужен.
#
# СХЕМА КАРТОЧКИ (каноническая, едина для всех файлов library/channels/):
#   channel_id, название, категория, этапы_воронки, подходит_для, не_подходит_для,
#   форматы, бенчмарки_2026 (каждое число → источник + дата_актуализации + статус),
#   особенности_модерации (запрещено / требуется), типовые_креативные_углы, комментарий_прохора
#
# СТАТУСЫ ИСТОЧНИКА (ядро доверия, см. references/communication-style.md):
#   verified-library — из верифицированной библиотеки, есть ссылка
#   web-search       — актуализируется живым WebSearch на момент сессии
#   hypothesis       — гипотеза для A/B-теста, не факт
#   object-claim     — данные на подтверждение заказчиком (требует подтверждения)
# Правило: ни одно число не выходит без объекта-источника. Нет источника → не выдаём,
# пишем «нет надёжных данных, нужен пилот». Бюджеты — диапазоны/доли, не «точная сумма».

channels:

  # ============================================================
  # 1. DOOH — Digital Out-of-Home (цифровая наружка, programmatic)
  # ============================================================
  - channel_id: dooh
    название: DOOH — цифровая наружная реклама (programmatic + прямые сети)
    категория: brand-offline
    этапы_воронки: [узнаваемость, охват]
    подходит_для:
      - ЖК комфорт / бизнес / премиум / элит (особенно крупные проекты в несколько очередей)
      - апарт-комплексы и сервисные апартаменты в проходных локациях
      - ТРЦ и районные ТЦ (геотаргет экранов в радиусе охвата)
      - БЦ класса A — экраны в деловых кластерах локации
      - гостиницы и апарт-отели на туристических и транзитных потоках
    не_подходит_для:
      - ЖК эконом без brand-бюджета — экономика не сходится
      - точечный лидген и догон остатков — не та механика, нет формы захвата
      - склады A/B и light industrial — ЦА (логисты, ритейлеры) не ловится наружкой
      - проект без узнаваемого имени и единого визуала — нечего впечатывать
    форматы:
      - цифровые билборды на трассах и въездах: 1 кадр 5–10 сек, текст ≤7 слов
      - сити-форматы (цифровые ситиборды, пиллары): вертикаль у пешеходных потоков
      - экраны в ТРЦ и на фуд-кортах: контакт с готовой к тратам аудиторией
      - экраны на АЗС, в БЦ, в лифтах ЖК (indoor DOOH)
      - DOOH programmatic через биржи (Hybrid, Soloway) — закупка по геолокации и времени
    бенчмарки_2026:
      - метрика: CPM_DOOH
        значение: "80–250 ₽"
        тип_источника: web-search
        источник: "WebSearch запрос «DOOH CPM Россия 2026 наружная реклама ставки» + сверка AdMetrix/OOH-операторы"
        дата_актуализации: "требует актуализации на момент сессии"
        статус: "ориентир-вилка, актуализировать WebSearch перед медиапланом"
      - метрика: стоимость_кампании_неделя_крупный_город
        значение: "ориентировочно от сотен тысяч до нескольких млн ₽ в зависимости от сети и охвата"
        тип_источника: hypothesis
        источник: "порядок величины; точная смета — только из медиаплана оператора"
        дата_актуализации: "требует подтверждения"
        статус: "гипотеза для A/B — точная цифра берётся из КП оператора, не из библиотеки"
      - метрика: экономия_programmatic_vs_прямые_сети
        значение: "programmatic-закупка обычно дешевле прямого размещения за счёт таргетинга показов"
        тип_источника: hypothesis
        источник: "отраслевая логика programmatic; конкретный % проверять WebSearch на сессии"
        дата_актуализации: "требует подтверждения"
        статус: "гипотеза для A/B, не выдавать как точный % без свежего источника"
    особенности_модерации:
      запрещено:
        - гарантии доходности, обещания прироста цены и арендной доходности (214-ФЗ / ФАС)
        - изображения и анимация, отвлекающие водителей (щиты вдоль дорог — требования к динамике)
        - тексты длиннее ~7 слов на трассовых щитах — не читаются на скорости
        - "лучший / №1 / единственный" без документального подтверждения
      требуется:
        - название юрлица застройщика и/или проектная декларация при упоминании цены
        - маркировка рекламы (ОРД) и erid — в т.ч. для programmatic-закупки
        - согласование размещения с муниципалитетом/оператором (зависит от локации)
        - на AI-визуале фасада — по умолчанию графика отдаётся чистой, без знака на самом изображении; маркировка «это AI-картинка, а не фото объекта» живёт текстовым токеном [▢ AI-визуализация] в артефакте рядом с картинкой, а не в пикселях; впечатать watermark в пиксель — опционально, только по явному запросу заказчика (см. references/image-generation.md)
    типовые_креативные_углы:
      - крупный визуал фасада ЖК + цена за м² одной строкой
      - "Старт продаж" + название очереди + QR на сайт/Telegram-канал
      - ключевая выгода в 5 словах под стадию (на котловане — цена входа; на сдаче — «въезжай»)
      - геопривязка: «в 12 минутах от метро Беговая» на экране у этого метро
    комментарий_прохора: >-
      Brand-канал для проектов с объёмом и горизонтом. Незаменим, когда нужно впечатать имя
      ЖК в район на старте многоочередного проекта. Для эконома — дорого и не окупится.
      DOOH programmatic беру вперёд прямых сетей при ограниченном бюджете: платишь за
      релевантные показы по гео и времени, а не за статичный месяц на одном щите. И сразу
      предупреждаю отдел продаж: лиды с наружки считаются через performance-ремаркетинг и
      рост брендового поиска, а не по форме захвата в первую неделю — иначе спишете рабочий
      канал в ноль раньше времени.

  # ============================================================
  # 2. Классическая наружная реклама (биллборды, ситиборды)
  # ============================================================
  - channel_id: ooh_classic
    название: Классическая наружная реклама (статичные биллборды, ситиборды, брандмауэры)
    категория: brand-offline
    этапы_воронки: [узнаваемость, охват]
    подходит_для:
      - ЖК комфорт / бизнес / премиум (особенно щиты на подъезде к самому объекту)
      - крупные проекты, где есть смысл в «доминировании» района щитами
      - ТРЦ и гостиницы — указатели и имиджевые конструкции на ключевых направлениях
      - брандмауэр на строящемся корпусе как самостоятельный носитель
    не_подходит_для:
      - ЖК эконом без brand-бюджета
      - точечный лидген — нет захвата, отдача только косвенная
      - склады и light industrial — нерелевантная аудитория
      - короткие промо-акции с быстрым дедлайном — производство и монтаж имеют лаг
    форматы:
      - билборд 3×6 м — базовый трассовый формат, текст крупно и коротко
      - суперсайт / суперборд — крупноформат на въездах и развязках
      - ситиборд / ситиформат — у пешеходных потоков и остановок
      - брандмауэр / сетка на фасаде стройки — носитель на самом объекте
      - арендованный щит у самого ЖК — «вы уже на месте»-механика
    бенчмарки_2026:
      - метрика: стоимость_щита_3x6_месяц
        значение: "сильно зависит от города и стороны/локации конструкции"
        тип_источника: web-search
        источник: "WebSearch «аренда билборда 3x6 стоимость [город] 2026» + прайсы операторов наружки"
        дата_актуализации: "требует актуализации на момент сессии"
        статус: "вилку давать только после WebSearch под конкретный город"
      - метрика: OTS_охват
        значение: "меряется в OTS (opportunity to see) по паспорту конструкции оператора"
        тип_источника: object-claim
        источник: "паспорт конструкции / данные оператора и Mediascope OOH"
        дата_актуализации: "требует подтверждения"
        статус: "берётся из медиапаспорта конкретной конструкции, не выдумывается"
    особенности_модерации:
      запрещено:
        - гарантии доходности и прироста цены (214-ФЗ / ФАС)
        - цена/ипотека без указания юрлица и проектной декларации
        - "от застройщика" без юрлица/ОГРН
        - перегруз текстом — больше 5–7 слов на трассовом щите не работает
      требуется:
        - наименование застройщика и проектная декларация при упоминании цены
        - маркировка ОРД и erid (в т.ч. для наружки — размещается на конструкции/в выходных данных)
        - согласование конструкции с органами (паспорт размещения)
        - на сгенерированном фасаде — по умолчанию графика отдаётся чистой, без знака на самом изображении; маркировка «это AI-картинка, а не фото объекта» живёт текстовым токеном [▢ AI-визуализация] в артефакте рядом с картинкой, а не в пикселях; впечатать watermark в пиксель — опционально, только по явному запросу заказчика
    типовые_креативные_углы:
      - имя ЖК + один сильный визуал фасада + «Старт продаж»
      - щит у объекта: «Ваш дом здесь» + срок сдачи
      - короткое УТП под стадию: на монолите — «видовые на залив», на сдаче — «ключи в [квартал/год]»
      - навигация: стрелка-указатель «ЖК — 800 м» на подъезде
    комментарий_прохора: >-
      Старый добрый щит всё ещё работает на узнаваемость, особенно конструкция у самого
      объекта и брандмауэр на стройке — это бесплатный по сути контакт с тем, кто уже едет
      мимо. Но это brand, а не лидген: статика, длинный лаг, отдача косвенная. Эконому
      обычно не по карману и не нужно. Перед тем как ставить цену на щит — проверяю
      декларацию и юрлицо, иначе ФАС снимет, а это уже не переклейка, а демонтаж за свой счёт.

  # ============================================================
  # 3. ТВ-реклама (региональная и федеральная)
  # ============================================================
  - channel_id: tv
    название: ТВ-реклама (региональные врезки и федеральные размещения)
    категория: brand-offline
    этапы_воронки: [узнаваемость, охват]
    подходит_для:
      - крупные ЖК и портфели проектов федерального/регионального девелопера
      - проекты с большим объёмом экспозиции и длинным горизонтом продаж
      - гостиницы и ТРЦ масштаба «событие города»
      - имиджевые задачи бренда застройщика (не отдельного лота)
    не_подходит_для:
      - один небольшой ЖК эконом/комфорт — охват дороже отдачи
      - точечный лидген и догон остатков
      - апарты-инвестпродукт под узкий сегмент — ЦА размывается
      - склады и B2B-недвижимость — нецелевой охват
    форматы:
      - региональные рекламные блоки (врезки в федеральные каналы по региону)
      - спонсорство передач и прогноза погоды (мягкий имиджевый контакт)
      - федеральное размещение (только для крупнейших брендов застройщиков)
      - продакт-плейсмент / спецпроекты на региональном ТВ
    бенчмарки_2026:
      - метрика: модель_закупки
        значение: "закупка по GRP/TRP (рейтинги), а не по показам; стоимость пункта рейтинга зависит от региона и сезона"
        тип_источника: verified-library
        источник: "стандарт ТВ-байинга (Mediascope как мерило рейтингов)"
        дата_актуализации: "2026-06-04"
        статус: "методология, не цена — конкретную стоимость пункта берём из КП селлера"
      - метрика: стоимость_пункта_рейтинга
        значение: "зависит от региона/сезона/каналов"
        тип_источника: web-search
        источник: "WebSearch «стоимость GRP ТВ реклама [регион] 2026» + КП ТВ-селлера (НРА и пр.)"
        дата_актуализации: "требует актуализации на момент сессии"
        статус: "цифру не выдавать без свежего источника/КП — высокий разброс"
      - метрика: порог_входа
        значение: "высокий минимальный бюджет — канал не для одного небольшого проекта"
        тип_источника: hypothesis
        источник: "отраслевая практика; точный порог — из КП селлера под регион"
        дата_актуализации: "требует подтверждения"
        статус: "гипотеза для оценки, уточнять под конкретный медиаплан"
    особенности_модерации:
      запрещено:
        - гарантии доходности и обещания прироста стоимости (214-ФЗ / ФАС)
        - цена и ипотечная ставка без указания банка, условий и проектной декларации
        - "лучший / №1" без подтверждения
      требуется:
        - юрлицо застройщика, проектная декларация при цене
        - маркировка рекламы и erid (ОРД распространяется и на ТВ-креатив в части выходных данных/онлайн-копий)
        - дисклеймер по ипотеке (банк, условия) при упоминании ставки
        - на любых сгенерированных кадрах объекта — по умолчанию графика отдаётся чистой, без знака на самом изображении; маркировка «это AI-картинка, а не фото объекта» живёт текстовым токеном [▢ AI-визуализация] в артефакте рядом с картинкой, а не в пикселях; впечатать watermark в пиксель — опционально, только по явному запросу заказчика
    типовые_креативные_углы:
      - имиджевый ролик бренда застройщика (доверие, надёжность, портфель сданного)
      - «город в городе» — масштаб квартала и инфраструктуры
      - эмоциональный сценарий «новый дом для семьи» (комфорт-класс)
      - анонс события: старт продаж очереди, открытие набережной/школы
    комментарий_прохора: >-
      ТВ — это про бренд застройщика и масштаб, а не про лиды на конкретную студию.
      Беру под крупные портфели и события города, где задача — доверие и охват. Для одного
      небольшого ЖК это стрельба из пушки по воробьям: порог входа высокий, отдача меряется
      brand lift'ом, а не звонками на следующий день. И сразу честно: точную стоимость
      пункта рейтинга я не назову из головы — это GRP-байинг, цифра живёт в КП селлера под
      ваш регион и сезон, актуализирую через WebSearch и помечаю источником.

  # ============================================================
  # 4. Радио (региональные станции)
  # ============================================================
  - channel_id: radio
    название: Радио — региональные станции (FM, сетевые)
    категория: brand-offline
    этапы_воронки: [узнаваемость, охват]
    подходит_для:
      - ЖК комфорт / бизнес — поддержка brand-кампании, особенно в авто-аудитории
      - крупные проекты с объёмом (нужна частота контактов)
      - ТРЦ и гостиницы — анонсы открытий и акций
      - геопривязка: станции города/региона, где идут продажи
    не_подходит_для:
      - ЖК эконом без brand-бюджета как самостоятельный канал
      - точечный лидген — отдача косвенная, без формы захвата
      - элит/премиум как основной канал — ЦА слушает реже, нужен подбор станции
      - склады и B2B — нерелевантно
    форматы:
      - рекламный ролик 15–30 сек в эфирной сетке
      - спонсорство рубрик (пробки, погода, утреннее шоу)
      - нативные интеграции в шоу (ведущий проговаривает)
      - анонсы событий проекта (старт продаж, день открытых дверей)
    бенчмарки_2026:
      - метрика: модель_закупки
        значение: "закупка по выходам/рейтингам станции; стоимость ролика зависит от станции, прайм/офф-прайм, города"
        тип_источника: verified-library
        источник: "стандарт радио-байинга (Mediascope Radio Index как мерило)"
        дата_актуализации: "2026-06-04"
        статус: "методология; конкретная цена — из прайса станции/селлера"
      - метрика: стоимость_выхода_ролика
        значение: "зависит от станции, города и слота"
        тип_источника: web-search
        источник: "WebSearch «реклама на радио [город] прайс 2026» + прайс конкретной станции"
        дата_актуализации: "требует актуализации на момент сессии"
        статус: "вилку давать только после WebSearch/прайса под город и станцию"
    особенности_модерации:
      запрещено:
        - гарантии доходности и прироста цены (214-ФЗ / ФАС)
        - цена и ставка ипотеки без банка/условий и проектной декларации
        - "от застройщика" без юрлица
      требуется:
        - юрлицо застройщика и проектная декларация при упоминании цены
        - маркировка рекламы и erid (выходные данные / онлайн-копии ролика)
        - дисклеймер по ипотеке при упоминании ставки
    типовые_креативные_углы:
      - короткий запоминающийся аудио-слоган + имя ЖК
      - анонс старта продаж очереди с дедлайном спецусловий
      - «по дороге домой» — авто-аудитория, локация у магистрали
      - событие: открытие набережной, дня открытых дверей на объекте
    комментарий_прохора: >-
      Радио — это частотная brand-поддержка, особенно если ваша ЦА много за рулём. Само по
      себе лидов с радио вы не насчитаете — это охват и узнаваемость в связке с performance.
      Под эконом в одиночку не ставлю, под событие (старт очереди, день открытых дверей) —
      рабочий усилитель. Цену выхода беру из прайса станции через WebSearch, не из воздуха.

  # ============================================================
  # 5. Programmatic (Hybrid, Soloway, Gpmd) — display/video brand-закупка
  # ============================================================
  - channel_id: programmatic
    название: Programmatic display/video (Hybrid, Soloway, Gpmd)
    категория: brand-offline
    этапы_воронки: [узнаваемость, охват, ремаркетинг]
    подходит_для:
      - ЖК комфорт / бизнес / премиум — медийный охват и brand-ремаркетинг
      - крупные проекты, где нужен масштабируемый охват с таргетингом
      - ТРЦ и гостиницы — медийная поддержка кампаний
      - связка с DOOH programmatic для омниканального brand-охвата
    не_подходит_для:
      - ЖК эконом с микробюджетом — порог и медийная природа не под точечный лидген
      - чистый перформанс на горячий спрос — для него performance-каналы (см. library/channels/performance.yaml)
      - склады/B2B как основной канал — узкая ЦА хуже набирается медийно
    форматы:
      - медийные баннеры (display) на премиальных площадках через DSP
      - видеореклама (in-stream / out-stream)
      - rich-media и брендированные форматы
      - programmatic-ремаркетинг по аудиториям сайта/CRM (brand-дожим)
    бенчмарки_2026:
      - метрика: CPM_programmatic_display
        значение: "вилка зависит от площадок, таргетинга и формата (видео дороже display)"
        тип_источника: web-search
        источник: "WebSearch «programmatic CPM Россия недвижимость 2026» + КП платформ (Hybrid/Soloway/Gpmd)"
        дата_актуализации: "требует актуализации на момент сессии"
        статус: "цифру брать из КП платформы под сетап, не из библиотеки"
      - метрика: модель_закупки
        значение: "аукционная закупка показов по аудиторным и контекстным таргетингам через DSP"
        тип_источника: verified-library
        источник: "стандарт programmatic-байинга"
        дата_актуализации: "2026-06-04"
        статус: "методология, не цена"
      - метрика: атрибуция
        значение: "brand-канал; вклад меряется post-view/post-click ассистами и ростом брендового поиска, не last-click"
        тип_источника: verified-library
        источник: "методология медийной атрибуции; см. стадии воронок в library/funnels.yaml"
        дата_актуализации: "2026-06-04"
        статус: "правило оценки канала — не убивать по last-click первой недели"
    особенности_модерации:
      запрещено:
        - гарантии доходности и прироста цены (214-ФЗ / ФАС)
        - цена/ипотека без проектной декларации и условий банка
        - "лучший / №1" без подтверждения
      требуется:
        - юрлицо застройщика, проектная декларация при цене
        - маркировка ОРД и erid (обязательна для programmatic-показов)
        - на сгенерированных фасадах в баннерах — по умолчанию графика отдаётся чистой, без знака на самом изображении; маркировка «это AI-картинка, а не фото объекта» живёт текстовым токеном [▢ AI-визуализация] в артефакте рядом с картинкой, а не в пикселях; впечатать watermark в пиксель — опционально, только по явному запросу заказчика
    типовые_креативные_углы:
      - медийный имиджевый баннер фасада + короткое УТП под стадию
      - brand-ремаркетинг на тех, кто был на сайте, но не оставил заявку
      - видеоистория квартала и инфраструктуры
      - анонс события (старт очереди) на охватных площадках
    комментарий_прохора: >-
      Programmatic — это управляемый медийный охват: аукцион, таргетинг по аудиториям,
      масштаб. Сила — в brand-ремаркетинге на тёплую базу и в связке с DOOH. Но мерить его
      по last-click первой недели — методическая ошибка: медийка работает на ассистах и
      росте брендового поиска, и при длинной сделке (3–9 мес) дозревает через performance.
      CPM беру из КП платформы под конкретный сетап и помечаю источником — фиксированной
      цифры тут нет.

