# Библиотека каналов Прохора — категория: commercial-b2b-hospitality
#
# Назначение: Прохор не выдумывает каналы — он подбирает их из этой библиотеки.
# Каждая карточка — канонической схемы (см. CHANNELS_LIBRARY_DRAFT.md).
#
# Охват этой категории: коммерческая недвижимость (БЦ, склады, стрит-ритейл),
# ТРЦ (B2B-лизинг площадей), гостиницы и апарт-отели. Профжаргон —
# коммерческий: GLA, tenant-mix, ставка капитализации, вакантность, NOI,
# light industrial, ADR/RevPAR. Сделка здесь B2B и длинная (аренда/лизинг/
# инвест-покупка), цикл часто длиннее жилого — атрибуцию по первой неделе не строим.
#
# Анти-галлюцинационный контракт (ядро доверия):
#   Каждое число несёт объект {значение, тип_источника, ссылка_или_запрос, дата, статус}.
#   Статусы бенчмарков в этом файле:
#     - "требует актуализации через WebSearch" — диапазон взят из открытых кейсов/тарифов
#       на дату актуализации; перед выдачей клиенту Прохор обновляет его живым WebSearch.
#     - "требует подтверждения" — данные/факт о платформе, который надо сверить у источника.
#     - "гипотеза для A/B" — ориентир под пилот, не факт.
#   Источник по каждому каналу — verified-library (эта карточка) + web-search (актуализация).
#   Нет надёжных данных → пишем "нет надёжных данных, нужен пилот", число не выдаём.
#
# Важно: поле не_подходит_для важнее, чем подходит_для — оно спасает от провального канала.
#
# ВНИМАНИЕ ПО ОХВАТУ v1: коммерческий контур (tenant-mix, NOI, ставка капитализации,
# пресеты под тип объекта) помечен в блюпринте как ранний/v2. Эти карточки —
# верифицированный задел библиотеки; перед боевой кампанией по коммерции бенчмарки
# обязательно актуализируются WebSearch и валидируются заказчиком.

channels:

  # ============================================================
  # 1. Циан Бизнес — коммерческая недвижимость
  # ============================================================
  - channel_id: cian_business
    название: Циан Бизнес (продажа и аренда коммерческой недвижимости)
    категория: commercial-b2b-hospitality
    этапы_воронки: [вовлечение, лидген, конверсия]
    подходит_для:
      - стрит-ритейл первых этажей (продажа и аренда помещения)
      - помещения свободного назначения (ПСН) и офисные блоки в БЦ
      - склады A/B класса и light industrial (продажа/аренда)
      - готовый арендный бизнес (ГАБ) с действующим арендатором
    не_подходит_для:
      - B2C-трафик посетителей в ТРЦ (это performance/social, а не классифайд коммерции)
      - брендовый разогрев крупного проекта (это brand-offline)
      - гостиничное бронирование (отдельная вертикаль travel)
    форматы:
      - карточка коммерческого объекта (площадь, ставка/цена, назначение, трафик локации)
      - продвижение и топ-выдача в коммерческой вертикали
      - брендированный блок застройщика/собственника
    бенчмарки_2026:
      CPL_стрит_ритейл:
        значение: "2500–7000 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPL Циан Бизнес стрит-ритейл коммерческая недвижимость 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      CPL_склад_аренда:
        значение: "4000–12000 ₽"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'CPL аренда склад A класс Циан Бизнес 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      стоимость_продвижения_лота_месяц:
        значение: "3000–15000 ₽ за лот"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'тарифы Циан Бизнес продвижение коммерция 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      примечание_по_циклу:
        значение: "сделка по коммерции длинная (подбор → просмотр → согласование ставки/цены → договор); лид первой недели не показатель"
        тип_источника: object-claim
        ссылка_или_запрос: "правило библиотеки: не убивать канал по лидам первых 2 недель (см. library/funnels.yaml)"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
    особенности_модерации:
      запрещено:
        - гарантии доходности арендного бизнеса и обещания заполняемости («окупится за N лет»)
        - превосходные степени без подтверждения («лучшая локация», «№1 по трафику»)
        - указание ставки/цены без условий (индексация, НДС, эксплуатационные платежи)
      требуется:
        - реальные фото/планировки помещения, актуальная площадь и ставка
        - данные юрлица собственника/застройщика, ОГРН
        - маркировка рекламы и ОРД (erid) при платном продвижении
    типовые_креативные_углы:
      - трафик локации и пешеходный поток (с источником замера, не на глаз)
      - tenant-mix окружения («рядом якорь-супермаркет, аптека, кофейня»)
      - назначение и подведённые мощности (электрика, вытяжка под общепит)
      - GAB с действующим договором аренды и ставкой
    комментарий_прохора: >
      Циан Бизнес — рабочий классифайд под коммерцию там, где есть сформированный спрос:
      человек уже ищет «помещение под кофейню у метро» или «склад класса A на КАД».
      Но не путай вертикали: трафик ПОСЕТИТЕЛЕЙ в ТРЦ ты тут не наберёшь, это B2C-история
      и совсем другой канал. И запомни главное по коммерции — цикл длинный, B2B-арендатор
      думает неделями и согласовывает ставку с финдиром. Смотреть на CPL за понедельник
      и кричать «не работает» — расписаться в непонимании, как устроен лизинг площадей.

  # ============================================================
  # 2. B2B-каталоги коммерческой недвижимости (склады, БЦ, ПСН)
  # ============================================================
  - channel_id: b2b_realty_catalogs
    название: B2B-каталоги коммерческой недвижимости (отраслевые агрегаторы складов и офисов)
    категория: commercial-b2b-hospitality
    этапы_воронки: [вовлечение, лидген]
    подходит_для:
      - склады A/B класса и light industrial (аренда крупных блоков)
      - БЦ класса A/B и офисные блоки под лизинг
      - сделки через брокеров коммерческой недвижимости (CBRE-подобные консультанты, IPG, NF)
    не_подходит_для:
      - жилая недвижимость (вертикали под неё — classified)
      - быстрый массовый лидген (трафик узкий, B2B-нишевый)
      - гостиничное бронирование
    форматы:
      - карточка объекта с техпаспортом (класс, GLA/площадь, высота потолков, нагрузка на пол)
      - размещение через брокера в закрытых базах предложений
      - тендерные/инвестиционные листинги (продажа объекта целиком, ставка капитализации)
    бенчмарки_2026:
      аудитория_канала:
        значение: "узкая, профильная (брокеры, корпоративные арендаторы, инвест-фонды)"
        тип_источника: object-claim
        ссылка_или_запрос: "WebSearch: 'B2B каталоги коммерческой недвижимости склады БЦ Россия 2026'"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
      CPL_ориентир:
        значение: "нет устойчивого публичного бенчмарка — лиды штучные, считаем по сделкам, не по заявкам"
        тип_источника: object-claim
        ссылка_или_запрос: "WebSearch: 'стоимость лида аренда склад A класс брокер 2026'"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
      метрика_успеха:
        значение: "снижение вакантности (vacancy rate) и LTV арендатора, а не CPL"
        тип_источника: object-claim
        ссылка_или_запрос: "правило библиотеки: для коммерции KPI — вакантность и срок договора, не лид"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
    особенности_модерации:
      запрещено:
        - обещания гарантированной доходности и заполняемости объекта
        - ставка капитализации без указания методики и допущений
        - технические характеристики (нагрузка на пол, высота, мощности) без подтверждения
      требуется:
        - корректный техпаспорт объекта (класс по принятой классификации, GLA/GBA, инженерия)
        - данные юрлица собственника, ОГРН
        - маркировка рекламы при платном размещении
    типовые_креативные_углы:
      - класс объекта и инженерия (высота потолков, нагрузка на пол, кол-во доков, шаг колонн)
      - транспортная доступность (выезд на трассу, ж/д-ветка, удалённость от хаба)
      - вакантность/заполняемость и якорные арендаторы (tenant-mix БЦ)
      - инвест-параметры: ставка капитализации, NOI — с методикой и пометкой «требует подтверждения»
    комментарий_прохора: >
      B2B-каталоги — это не про охват, это про попадание в нужные 200 человек: брокеров и
      корпоративных арендаторов, которые двигают сделки на тысячи квадратов. CPL тут считать
      бессмысленно — лиды штучные, мерило успеха другое: вакантность объекта вниз, срок
      договора и LTV арендатора вверх. Любую цифру по нагрузке на пол, высоте потолков и
      ставке капитализации даю только с пометкой «требует подтверждения» — в коммерции
      техпаспорт и методика расчёта это юридически чувствительная фактура, на глаз тут нельзя.

  # ============================================================
  # 3. LinkedIn-аналоги для коммерческой недвижимости класса A
  # ============================================================
  - channel_id: linkedin_b2b_realty
    название: LinkedIn и его аналоги (B2B-таргет на ЛПР по коммерческой недвижимости класса A)
    категория: commercial-b2b-hospitality
    этапы_воронки: [охват, вовлечение, лидген]
    подходит_для:
      - БЦ класса A (аренда офисов крупными корпоративными арендаторами)
      - light industrial и склады A класса под сделки с сетевыми/международными компаниями
      - таргет на ЛПР: директора по недвижимости, операционные, административные директора, брокеры
    не_подходит_для:
      - массовый жилой сегмент и эконом-жильё (ЦА не здесь)
      - B2C-трафик в ТРЦ и гостиничное бронирование
      - регионы с тонкой профессиональной аудиторией в сети
    примечание_платформы:
      значение: "доступ к самому LinkedIn из РФ ограничен; под российский рынок используются деловые соцсети и таргет по должностям (VK Ads/myTarget по интересам и сфере), отраслевые сообщества"
      тип_источника: object-claim
      ссылка_или_запрос: "WebSearch: 'таргетинг на ЛПР коммерческая недвижимость B2B соцсети Россия 2026'"
      дата_актуализации: 2026-04-28
      статус: требует подтверждения
    форматы:
      - таргет по должности/сфере (sponsored content в деловой ленте)
      - InMail-аналоги / личные сообщения ЛПР (через брокеров и сейлзов)
      - публикации экспертного контента (кейсы по объекту, разбор локации)
    бенчмарки_2026:
      CPL_B2B_недвижимость:
        значение: "высокий — лид дорогой, но целевой; устойчивого публичного числа по РФ-аналогам нет"
        тип_источника: object-claim
        ссылка_или_запрос: "WebSearch: 'CPL B2B таргет ЛПР коммерческая недвижимость класс A 2026'"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
      длина_цикла:
        значение: "самый длинный из каналов категории (корпоративное согласование аренды класса A)"
        тип_источника: object-claim
        ссылка_или_запрос: "правило библиотеки: оценивать по подписанным договорам, не по лидам"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
    особенности_модерации:
      запрещено:
        - гарантии доходности инвестору и обещания заполняемости
        - вводящие в заблуждение характеристики класса объекта (B под видом A)
        - персональные обещания без основания
      требуется:
        - корректное указание класса объекта по принятой классификации
        - данные юрлица, ОГРН
        - маркировка рекламы и ОРД (erid) при платном продвижении
    типовые_креативные_углы:
      - класс A как сигнал статуса арендатора (репутация адреса, престиж локации)
      - инфраструктура БЦ для сотрудников (паркинг, общепит, транспортная доступность)
      - гибкость планировок и техническое оснащение под корпоративного арендатора
      - экспертный контент: разбор tenant-mix и динамики ставок в локации
    комментарий_прохора: >
      LinkedIn в чистом виде из России недоступен, поэтому под класс A работаем аналогами —
      таргетом по должностям в деловых соцсетях и отраслевым контентом, плюс прямая работа
      брокеров с ЛПР. Аудитория здесь штучная: директор по недвижимости сетевой компании,
      который решает, где сидеть пятистам сотрудникам. Лид дорогой и долгий — корпоративная
      аренда класса A согласуется месяцами. Любую цифру CPL по РФ-аналогам даю с пометкой
      «требует подтверждения»: устойчивого публичного бенчмарка тут нет, и выдумывать его я не буду.

  # ============================================================
  # 4. Колл-центры и outbound (премиум, инвест-сегмент, B2B)
  # ============================================================
  - channel_id: call_center_outbound
    название: Колл-центры и outbound-обзвон (премиум, инвест-сегмент, B2B-арендаторы)
    категория: commercial-b2b-hospitality
    этапы_воронки: [квалификация, конверсия, дожим]
    подходит_для:
      - премиум/элит жильё и сервисные апартаменты (персональный контакт с покупателем)
      - инвест-сегмент (дожим по тёплой базе, апарты с УК)
      - B2B-арендаторы коммерции (прямой выход на брокеров и корпоративных клиентов)
      - реактивация базы заявок, не дошедших до брони (см. library/funnels.yaml, стадия «думает»)
    не_подходит_для:
      - холодный массовый прозвон по жилью эконом (низкая конверсия, репутационный риск)
      - первичная узнаваемость и охват (это не задача обзвона)
    форматы:
      - входящая линия (обработка заявок с performance/classified)
      - outbound по тёплой базе (дожим «думающих», реактивация)
      - B2B-сейлз прямой выход на ЛПР и брокеров
    бенчмарки_2026:
      конверсия_тёплой_базы_в_показ:
        значение: "ориентир выше холодного обзвона в разы — но зависит от качества базы"
        тип_источника: hypothesis
        ссылка_или_запрос: "проверяется сплитом тёплая база vs холодный список в отчёте колл-центра"
        дата_актуализации: 2026-04-28
        статус: гипотеза для A/B
      стоимость_контакта:
        значение: "нет устойчивого публичного бенчмарка — считается по ставке оператора и длине разговора"
        тип_источника: object-claim
        ссылка_или_запрос: "WebSearch: 'стоимость лида колл-центр обзвон недвижимость премиум 2026'"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
    особенности_модерации:
      запрещено:
        - обещания гарантированной доходности и одобрения ипотеки по телефону
        - навязчивые повторные звонки и нарушение согласия на обработку данных
        - скрипты с искусственной срочностью и давлением
      требуется:
        - согласие на обработку персональных данных (152-ФЗ) и право на отказ
        - соблюдение требований к рекламным звонкам и записи разговора с уведомлением
        - корректная фактура в скрипте (цена/ставка с условиями, никаких выдуманных гарантий)
    типовые_креативные_углы:
      - персональный подбор лота под запрос (премиум любит индивидуальный сервис)
      - дожим «думающего» на стадии выбора (ответы на барьеры, спецусловие)
      - B2B: прямой разговор о ставке, площади, сроках под конкретного арендатора
      - реактивация: «вы интересовались полгода назад, вышла новая очередь/планировка»
    комментарий_прохора: >
      Обзвон — это не про охват, это про дожим и квалификацию там, где сделка дорогая и
      персональная: премиум, инвест, B2B-аренда. На тёплой базе — отдельный человек,
      который оставил заявку и «завис» на стадии думает, обзвон вытаскивает в показ как
      ничто другое. А вот холодный массовый прозвон по эконому — это репутационный минус
      и слитый бюджет, туда не лезем. По закону жёстко: согласие на обработку данных,
      право на отказ, никаких гарантий доходности голосом — телефон не отменяет 152-ФЗ
      и здравый смысл. Гарантию заполняемости в скрипт я не впишу, дам диапазон с оговоркой.

  # ============================================================
  # 5. Конференции и event-маркетинг (БЦ, склады, гостиницы, инвест)
  # ============================================================
  - channel_id: conferences_events
    название: Конференции и event-маркетинг (отраслевые форумы, road-show, инвест-презентации)
    категория: commercial-b2b-hospitality
    этапы_воронки: [узнаваемость, вовлечение, лидген]
    подходит_для:
      - БЦ класса A и крупные офисные проекты (выход на корпоративных арендаторов)
      - склады и light industrial (отраслевые логистические форумы)
      - гостиницы и апарт-отели (travel- и hospitality-форумы, выход на операторов)
      - инвест-объекты целиком (инвест-конференции, road-show под продажу ГАБ/портфеля)
    не_подходит_для:
      - массовый жилой лидген (нерелевантный формат, дорогой контакт)
      - быстрая конверсия с жёстким CPL (event — про длинные отношения, не про заявку завтра)
    форматы:
      - стенд/экспозиция на отраслевом форуме (недвижимость, логистика, ритейл, гостеприимство)
      - доклад/кейс спикера (экспертное позиционирование объекта и команды)
      - инвест-презентация и road-show под конкретный объект/портфель
      - закрытый бизнес-завтрак для ЛПР и брокеров
    бенчмарки_2026:
      стоимость_контакта:
        значение: "высокая за контакт, но контакт качественный и целевой (ЛПР, брокер, оператор)"
        тип_источника: object-claim
        ссылка_или_запрос: "WebSearch: 'стоимость участия стенд отраслевой форум недвижимости логистика 2026'"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
      горизонт_эффекта:
        значение: "длинный — сделки дозревают месяцами после контакта; ROI меряем по подписанным договорам"
        тип_источника: object-claim
        ссылка_или_запрос: "правило библиотеки: event оценивать по сделкам за квартал, не по лидам за неделю"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
    особенности_модерации:
      запрещено:
        - обещания гарантированной доходности и заполняемости в презентации/раздатке
        - инвест-цифры (NOI, ставка капитализации, IRR) без методики и допущений
        - превосходные степени без подтверждения
      требуется:
        - корректные техпараметры объекта и данные юрлица в раздаточных материалах
        - маркировка рекламных материалов
        - оговорки о допущениях по любым инвест-расчётам
    типовые_креативные_углы:
      - экспертный разбор локации и tenant-mix как контент доклада
      - инвест-кейс объекта с прозрачной методикой (ставка капитализации, NOI — с оговорками)
      - нетворкинг с операторами/брокерами как ценность участия
      - демо объекта на стенде (макет, VR-тур — с пометкой «AI-визуализация» на сгенерированных)
    комментарий_прохора: >
      Event — это длинная игра для коммерции и гостиниц: ты не собираешь заявки, ты заводишь
      отношения с теми, кто двигает крупные сделки — операторами, брокерами, корпоративными
      арендаторами. Контакт дорогой, зато целевой, и эффект растянут на кварталы: подписанный
      договор всплывёт через полгода после бизнес-завтрака. Мерить такое по лидам за неделю —
      гиблое дело, считаем по сделкам. Инвест-цифры в презентации даю только с методикой и
      оговорками: NOI и ставку капитализации без допущений на сцене показывать нельзя, это
      прямой путь под претензию. На стенде гостиницы кстати играем — там форумы это родная среда.

  # ============================================================
  # 6. Системы бронирования для гостиниц (Островок, Яндекс Путешествия, Bronevik)
  # ============================================================
  - channel_id: hotel_booking_systems
    название: Системы бронирования для гостиниц (Островок, Яндекс Путешествия, Bronevik, OTA)
    категория: commercial-b2b-hospitality
    этапы_воронки: [вовлечение, конверсия, удержание]
    подходит_для:
      - гостиницы и отели (загрузка номерного фонда, прямые и OTA-брони)
      - апарт-отели и сервисные апартаменты с гостиничной моделью эксплуатации
      - объекты на туристических и деловых потоках (город, курорт, у транспортного хаба)
    не_подходит_для:
      - продажа недвижимости в собственность (это classified/performance, не booking)
      - чистый B2B-лизинг офисов/складов
      - жилые ЖК без гостиничной эксплуатации
    форматы:
      - карточка объекта в OTA (фото номеров, удобства, тарифы, отзывы, рейтинг)
      - спонсированное размещение и буст позиции в выдаче OTA
      - тарифные планы и динамическое ценообразование (revenue management)
      - программы лояльности и прямые брони (в обход комиссии OTA)
    бенчмарки_2026:
      комиссия_OTA:
        значение: "типично 15–25% от стоимости брони (зависит от площадки и условий)"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'комиссия Островок Bronevik Яндекс Путешествия отели 2026 процент'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      ключевые_метрики:
        значение: "загрузка (occupancy), ADR (средняя цена номера), RevPAR (доход на номер) — KPI, не CPL"
        тип_источника: object-claim
        ссылка_или_запрос: "правило библиотеки: гостиница меряется occupancy/ADR/RevPAR, не лидом"
        дата_актуализации: 2026-04-28
        статус: требует подтверждения
      доля_прямых_броней:
        значение: "цель — растить долю прямых броней, чтобы снижать комиссию OTA"
        тип_источника: hypothesis
        ссылка_или_запрос: "проверяется сплитом прямой канал vs OTA в отчёте PMS отеля"
        дата_актуализации: 2026-04-28
        статус: гипотеза для A/B
    особенности_модерации:
      запрещено:
        - недостоверные фото и параметры номеров (несоответствие реальности)
        - накрутка отзывов и рейтинга
        - скрытые обязательные платежи без указания в цене
        - изображения интерьеров без пометки, если это AI-визуализация
      требуется:
        - реальные фото объекта и актуальные тарифы/условия
        - корректная классификация (звёздность, тип номеров) по принятым стандартам
        - данные юрлица, ОГРН; для рекламы — маркировка и ОРД (erid)
    типовые_креативные_углы:
      - локация и потоки (близость к центру/курорту/деловому кластеру/хабу)
      - удобства и сервис (завтрак, паркинг, трансфер, рабочая зона для делового гостя)
      - тариф под сегмент (деловой/туристический/длительное проживание)
      - отзывы и рейтинг как социальное доказательство
    комментарий_прохора: >
      Бронирование — отдельная вселенная от продажи метров: тут ты не продаёшь квартиру,
      ты грузишь номерной фонд каждую ночь. Островок, Bronevik, Яндекс Путешествия дают
      объём, но забирают комиссию 15–25% — точную цифру обновляю WebSearch перед планом,
      она у каждой площадки своя. Стратегически задача двойная: набрать загрузку через OTA
      и параллельно растить долю прямых броней, чтобы не кормить комиссией весь P&L.
      И меряем мы тут не CPL, а occupancy, ADR и RevPAR — кто пытается оценить отель по
      стоимости лида, тот не понимает экономику гостеприимства. Фото — только реальные;
      если показываем сгенерированный интерьер, шлёпаем «AI-визуализация», иначе это обман гостя.

  # ============================================================
  # 7. Партнёрские и реферальные программы (B2B-сеть, брокеры, корпоративы)
  # ============================================================
  - channel_id: partner_referral_programs
    название: Партнёрские и реферальные программы (брокеры, агрегаторы, корпоративные партнёры)
    категория: commercial-b2b-hospitality
    этапы_воронки: [лидген, конверсия]
    подходит_для:
      - коммерческая недвижимость через сеть брокеров (БЦ, склады, стрит-ритейл, ГАБ)
      - гостиницы через travel-партнёров, корпоративные договоры, программы лояльности
      - апарт-комплексы с УК через партнёрскую сеть и реферальные бонусы покупателям
      - кросс-продажи в экосистеме застройщика (квартира → кладовка → паркинг → ритейл)
    не_подходит_для:
      - первичная узнаваемость холодной ЦА (партнёрка не создаёт спрос, она его конвертирует)
      - объекты без понятной комиссионной/бонусной модели для партнёра
    форматы:
      - агентское/брокерское вознаграждение за приведённую сделку (% или фикс)
      - реферальная программа «приведи друга» для покупателей/арендаторов
      - корпоративные партнёрства (банки, УК, travel-операторы, бизнес-сообщества)
      - кросс-промо внутри экосистемы девелопера
    бенчмарки_2026:
      агентская_комиссия:
        значение: "по жилью типично 2–5% от сделки; по коммерции и аренде — индивидуально по договору"
        тип_источника: verified-library
        ссылка_или_запрос: "WebSearch: 'агентское вознаграждение застройщик брокер комиссия недвижимость 2026'"
        дата_актуализации: 2026-04-28
        статус: требует актуализации через WebSearch
      качество_лида:
        значение: "выше среднего — партнёр приводит квалифицированного клиента, но объём ограничен сетью"
        тип_источника: hypothesis
        ссылка_или_запрос: "проверяется разрезом конверсии партнёрский лид vs прямой трафик"
        дата_актуализации: 2026-04-28
        статус: гипотеза для A/B
    особенности_модерации:
      запрещено:
        - обещания доходности и заполняемости в партнёрских материалах
        - реферальные офферы с признаками финансовой пирамиды/сетевого маркетинга
        - бонусы, замаскированные под скидку без указания условий
      требуется:
        - прозрачные условия комиссии/бонуса и сроков выплаты в договоре
        - корректная фактура объекта в партнёрских материалах (цена/ставка с условиями)
        - маркировка рекламы и ОРД (erid) в публичных партнёрских креативах
    типовые_креативные_углы:
      - выгода партнёру (комиссия, эксклюзив на лот, маркетинговая поддержка)
      - реферальный бонус покупателю/арендатору (с прозрачными условиями)
      - корпоративный пакет (спецусловия для сотрудников компании-партнёра)
      - кросс-оффер в экосистеме (квартира + кладовая + машино-место одним пакетом)
    комментарий_прохора: >
      Партнёрка и рефералка — канал не про создание спроса, а про его конвертацию чужими
      руками: брокер, банк, УК или довольный покупатель приводят тёплого клиента за процент.
      Лид тут качественнее среднего, но объём упирается в размер сети — это не масштабируемый
      охват, это умножение того, что уже есть. По коммерции брокерская сеть часто решает
      больше любого классифайда. Юридически держим ухо востро: реферальный оффер не должен
      пахнуть пирамидой, а бонус — быть скидкой с прозрачными условиями, иначе ловим претензию.
      И как везде: доходность арендного бизнеса партнёру не гарантируем, даём фактуру с оговорками.
