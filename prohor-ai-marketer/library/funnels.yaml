# Как Прохор использует эту библиотеку:
#   1. По типу объекта берёт каркас воронки (этапы + типовые каналы).
#   2. Кастомизирует под стадию жизненного цикла (references/pipeline.md, этап 2)
#      и absorption-вердикт (вес brand vs performance по этапам).
#   3. KPI-числа этапов — типовые ориентиры [△]/[◐], НЕ обещания: реальные цели
#      берёт из CRM заказчика или ставит под пилот.
#   4. Лаги эскроу/ДДУ/одобрения ипотеки берёт прямо из стадий воронок ЭТОГО файла.
#   5. Конкретные CPL/CPC/CPM — НЕ отсюда, а из library/benchmarks.yaml и channels/*
#      (актуализируются через WebSearch).
#   6. Для коммерции/гостиниц (ранний контур v2) явно предупреждает заказчика, что
#      KPI требуют верификации под конкретный проект.
