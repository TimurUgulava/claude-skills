# Библиотека воронок Прохора — типовые воронки продаж по типам объектов
#
# Назначение: Прохор не выдумывает воронку с нуля — он берёт типовой каркас под
# тип объекта из этой библиотеки и кастомизирует под конкретный проект, стадию
# жизненного цикла и absorption-вердикт.
#
# Главная отраслевая правда, зашитая в каждую жилую воронку:
#   СДЕЛКА В НЕДВИЖИМОСТИ ДЛИННАЯ. Цикл первичного жилья — типично 3–9 месяцев
#   от первого касания до ДДУ через эскроу. Поэтому:
#     - нельзя оценивать канал по лидам первой недели (brand дозревает через
#       ремаркетинг) — это и есть правило «не убивай канал на второй неделе»,
#       зашитое в стадии воронок ниже в ЭТОМ файле;
#     - одобрение ипотеки — отдельный этап и типовое узкое место (лаг 5–15 дней),
#       не «технический шаг», а точка, где сделка реально сыпется;
#     - продажа идёт по ДДУ через эскроу-счёт — деньги покупателя замораживаются
#       до сдачи дома, это и аргумент доверия в креативе, и реальный лаг в воронке;
#     - атрибуция честная: первый-клик и последний-клик врут на длинном цикле,
#       brand-каналы недооцениваются по last-click.
#
# Анти-галлюцинационный контракт (ядро доверия, едино со SKILL.md и channels/*):
#   Любое содержательное число = объект {значение, тип_источника,
#   ссылка_или_запрос, дата_актуализации, статус}.
#   Статусы в этом файле:
#     [✓ verified-library]      — структурная норма этапа, проверена логикой рынка
#     [△ требует подтверждения] — типовой ориентир из открытых данных; конкретные
#                                  KPI/лаги заказчик сверяет со своей CRM
#     [◐ гипотеза → A/B]        — оценка под пилот, не факт
#   KPI-числа этапов помечены [△]/[◐]: это типовые ориентиры под кастомизацию,
#   НЕ обещание показателя. Реальные KPI берём из CRM заказчика или ставим под
#   пилот. Конкретные CPL/CPC/CPM — НЕ здесь, а в library/benchmarks.yaml и
#   library/channels/* (актуализируются через WebSearch).
#   Нет надёжных данных → пишем "нет надёжных данных, нужен пилот".
#
# Связь с другими модулями:
#   - этап «одобрение ипотеки» и лаги эскроу/ДДУ детализированы ниже в ЭТОМ файле
#     (стадии воронок жилья);
#   - выбор brand vs performance по этапам наследуется из absorption-вердикта
#     (references/pipeline.md, этап 1): «давим конверсию» → вес на лидген/конверсию;
#     «снимаем газ» → вес на brand под следующую очередь;
#   - типовые_каналы ссылаются на channel_id из library/channels/*.
#
# Канонический словарь этапов воронки (един для всех типов):
#   brand → охват → вовлечение → лидген → квалификация → конверсия/сделка → ремаркетинг
#   (для жилья между «конверсия» и «сделка» вклинивается узел «одобрение ипотеки»).
#
# v1 = жильё + апарты (проработано). Коммерция (БЦ / ТРЦ / склад / гостиница)
#   дана ранним контуром: каркас этапов есть, KPI требуют верификации в v2.

funnels:

  # ============================================================
  # 1. ЖК эконом / комфорт — массовое первичное жильё
  #    Базовый паттерн. Наш демо-объект (условный ЖК комфорт-класса) идёт по нему.
  # ============================================================
  - funnel_id: zhk_econom_comfort
    тип_объекта: ЖК (эконом / комфорт)
    краткое_описание: >
      Массовое первичное жильё со сформированным спросом. Длинный цикл, ипотека —
      решающий узел, эскроу как аргумент доверия. Ядро ЦА — семьи и первое жильё.
    типовая_длительность_сделки:
      значение: "3–6 месяцев от первого касания до ДДУ (комфорт чаще ближе к 3–5 мес)"
      тип_источника: verified-library
      ссылка_или_запрос: "WebSearch: 'цикл сделки новостройка комфорт-класс срок до ДДУ 2026'"
      дата_актуализации: 2026-04-28
      статус: требует подтверждения
    этапы:

      - этап: brand / узнаваемость
        задача: ввести проект в рассмотрение до старта активного выбора
        KPI:
          охват_уникальных:
            значение: "максимизировать на старте очереди, цель — known-brand в локации"
            тип_источника: verified-library
            ссылка_или_запрос: "норма этапа: brand измеряется охватом/частотой, не лидами"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
          частота_контакта:
            значение: "ориентир 3–5 касаний на разогрев (гипотеза под проект)"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется brand-lift / post-view опросом"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "1–2 месяца до и в начале старта продаж"
        типовые_каналы: [yandex_direct_rsya, vk_ads_performance, mytarget, dooh, naruzhka]
        метрики: [охват, частота, brand-lift, post-view узнаваемость]
        предупреждение_атрибуции: >
          brand не даёт лидов напрямую и проваливается по last-click — не режь его
          по «нулю заявок» в первую неделю, он работает на дозревание спроса.

      - этап: охват
        задача: показаться сформированному и около-целевому спросу в локации
        KPI:
          CPM_в_норме_канала:
            значение: "контролировать по library/channels/* (CPM РСЯ/VK/MyTarget)"
            тип_источника: verified-library
            ссылка_или_запрос: "library/channels/performance.yaml, social.yaml — бенчмарки CPM"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
          viewability:
            значение: "ориентир по медийке ≥ норма площадки"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется отчётом размещения"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "сквозной этап на всём флайте"
        типовые_каналы: [yandex_direct_rsya, vk_ads_performance, mytarget, yandex_business_2gis]
        метрики: [показы, CPM, охват, частота, viewability]

      - этап: вовлечение
        задача: перевести интерес в действие — клик, просмотр планировок, подписка
        KPI:
          CTR:
            значение: "контролировать по норме канала (см. channels/*)"
            тип_источника: verified-library
            ссылка_или_запрос: "library/channels/* — поле CTR в бенчмарках"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
          глубина_просмотра_сайта:
            значение: "просмотр планировок/хода стройки как сигнал тёплого интереса"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется метрикой сайта по сегментам трафика"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "сквозной этап"
        типовые_каналы: [yandex_direct_search, vk_ads_performance, vk_smm, telegram, classified_avito, classified_cian]
        метрики: [CTR, клики, глубина просмотра, время на сайте, подписки на ход стройки]

      - этап: лидген
        задача: собрать заявку (звонок, форма, лид-форма, заявка на classified)
        KPI:
          CPL:
            значение: "контролировать по library/benchmarks.yaml и channels/* под класс и канал"
            тип_источника: verified-library
            ссылка_или_запрос: "library/benchmarks.yaml — CPL_ЖК_комфорт по каналам"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
          доля_целевых_лидов:
            значение: "ориентир, считается после квалификации; лид ≠ покупатель"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется на этапе квалификации в CRM"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "сквозной, ядро performance-флайта"
        типовые_каналы: [yandex_direct_search, vk_ads_performance, mytarget, classified_avito, classified_cian, classified_domclick, classified_yandex_realty]
        метрики: [лиды, CPL, конверсия клик→лид, доля целевых лидов]
        предупреждение_атрибуции: >
          classified (Авито/Циан/Домклик) часто даёт самый горячий лид — человек уже
          в режиме выбора квартиры; performance-соцсети дают холоднее, им нужен догрев.

      - этап: квалификация
        задача: отделить целевой лид от «просто посмотреть», передать в отдел продаж
        KPI:
          конверсия_лид_в_квал:
            значение: "типовой ориентир — заметная доля отсева, особенно из лид-форм"
            тип_источника: hypothesis
            ссылка_или_запрос: "library/channels/social.yaml: качество лида из лид-формы [◐]"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
          скорость_первого_контакта:
            значение: "норма — дозвон в минуты, не часы (длинный цикл начинается с быстрого ответа)"
            тип_источника: verified-library
            ссылка_или_запрос: "правило отдела продаж: скорость реакции на лид влияет на конверсию"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "первые часы–дни после лида"
        типовые_каналы: [callcenter_outbound, messenger_marketing]
        метрики: [конверсия лид→квал, время до первого контакта, доля недозвонов]
        примечание: >
          стык маркетинга и продаж. Прохор не управляет отделом продаж, но
          закладывает скорость и квалификацию в KPI — иначе дешёвый лид не доходит до брони.

      - этап: показ / ВКС / встреча
        задача: показать объект, офис продаж, шоурум или провести видеоконсультацию
        KPI:
          конверсия_квал_в_показ:
            значение: "типовой ориентир, сверяется по CRM заказчика"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется по воронке CRM"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "несколько дней–недель после квалификации (стадия «думает»)"
        типовые_каналы: [messenger_marketing, callcenter_outbound]
        метрики: [конверсия квал→показ, доля доходимости до офиса, NPS встречи]
        точка_дожима: >
          стадия «думает» — здесь работает ремаркетинг на ход стройки, эскроу-аргумент
          и ипотечные программы; не давить срочностью (ловушка модерации).

      - этап: бронь
        задача: зафиксировать выбранный лот бронированием (часто платным/возвратным)
        KPI:
          конверсия_показ_в_бронь:
            значение: "ключевая метрика отдела продаж, сверяется по CRM"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется по воронке CRM заказчика"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "решение о брони — дни"
        типовые_каналы: [callcenter_outbound, messenger_marketing]
        метрики: [брони, конверсия показ→бронь, доля платных броней]
        примечание: >
          бронь — главный «маркетинговый» результат на длинном цикле: оценивай каналы
          по броням за 1–2 месяца, а не по лидам за первую неделю.

      - этап: одобрение ипотеки
        задача: получить одобрение банка-партнёра (Сбер, ВТБ и др.), подобрать программу
        KPI:
          доля_одобрений:
            значение: "типовое узкое место воронки; доля отказов реальна и существенна"
            тип_источника: verified-library
            ссылка_или_запрос: "этап «одобрение ипотеки» этой воронки (library/funnels.yaml) — узкое место одобрения"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
          лаг_одобрения:
            значение: "5–15 дней (типовой ориентир, зависит от банка и заёмщика)"
            тип_источника: verified-library
            ссылка_или_запрос: "WebSearch: 'срок одобрения ипотеки банк 2026 новостройка'"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "5–15 дней (стадия «ждёт одобрения»)"
        типовые_каналы: [callcenter_outbound, messenger_marketing]
        метрики: [доля одобрений, средний лаг одобрения, доля отказов банка]
        точка_дожима: >
          стадия «ждёт одобрения» — поддерживающие касания, помощь с документами,
          альтернативные программы (семейная, IT-ипотека) и банки при отказе.
          Это НЕ маркетинговый этап в чистом виде, но лаг и отказы напрямую бьют по
          итоговой конверсии — закладывай их в план, иначе «бронь была, а сделки нет».

      - этап: ДДУ через эскроу / сделка
        задача: подписать ДДУ, разместить средства на эскроу-счёте, регистрация в Росреестре
        KPI:
          конверсия_бронь_в_дду:
            значение: "финальная метрика сделки, сверяется по CRM"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется по воронке CRM"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
          лаг_регистрации_росреестр:
            значение: "типовой ориентир по срокам регистрации ДДУ (требует сверки)"
            тип_источника: verified-library
            ссылка_или_запрос: "WebSearch: 'срок регистрации ДДУ Росреестр 2026'"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "дни–недели (одобрение → ДДУ → эскроу → Росреестр)"
        типовые_каналы: []
        метрики: [сделки/ДДУ, конверсия бронь→ДДУ, объём средств на эскроу]
        примечание: >
          деньги на эскроу заморожены до сдачи дома — это и аргумент доверия в
          креативе («ваши деньги под защитой эскроу»), и реальный лаг до выручки
          застройщика. Эскроу удлиняет путь «деньги покупателя → деньги застройщика».

      - этап: ремаркетинг / удержание
        задача: вернуть ушедших без брони, дожать «думающих», работать на следующую очередь
        KPI:
          возврат_из_ремаркетинга:
            значение: "ориентир по доле броней с ремаркетинга (под пилот)"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется отдельным сегментом ремаркетинга"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "сквозной, весь цикл продаж очереди"
        типовые_каналы: [yandex_direct_rsya, vk_ads_performance, telegram, messenger_marketing, email]
        метрики: [возвраты, конверсия ремаркетинга в бронь, частота касаний]
        примечание: >
          на длинном цикле ремаркетинг — главный инструмент дожима; именно сюда
          утекает спрос «ещё думаю». Сегментируй по стадии: «был на сайте»,
          «оставил лид но не дошёл», «ждёт одобрения».

    absorption_связка: >
      Вердикт «темп ниже плана → давим конверсию» смещает вес на лидген/квалификацию/
      конверсию и спецусловия; «распродаёмся быстро → снимаем газ» — снимает
      performance-давление и переносит вес в brand под следующую очередь.
      Для нашего демо-объекта (условный ЖК комфорт-класса): 180 из 640 лотов 1-й очереди за 6 мес
      (~30 лотов/мес) — темп ниже равномерного плана, вердикт «давим конверсию».
    комментарий_прохора: >
      Это базовая воронка массового жилья, и главное в ней — не количество этапов, а
      их длина. Девелопер привык смотреть на лиды за неделю и делать выводы о канале —
      на цикле в 3–6 месяцев это самоубийство аналитики. Реальные точки, где сделка
      сыпется, — не «мало кликов», а «не дозвонились за 5 минут», «не дожали думающего»
      и «банк не одобрил ипотеку». Я закладываю одобрение ипотеки отдельным этапом с
      честным лагом, потому что это узкое место номер один, и про него все забывают,
      когда хвалятся дешёвым лидом. Оценивай каналы по броням за месяц-два, а не по
      заявкам за понедельник.

  # ============================================================
  # 2. ЖК бизнес / премиум / элит — дорогое первичное жильё
  # ============================================================
  - funnel_id: zhk_business_premium_elite
    тип_объекта: ЖК (бизнес / премиум / элит)
    краткое_описание: >
      Дорогое жильё, узкая ЦА, длинный и «человеческий» цикл — больше веса на бренд,
      персональный контакт и наружку, меньше на дешёвый performance-лидген.
    типовая_длительность_сделки:
      значение: "от 4–9 месяцев и дольше (чем выше класс, тем длиннее и индивидуальнее)"
      тип_источника: verified-library
      ссылка_или_запрос: "WebSearch: 'цикл сделки премиум элит новостройка срок 2026'"
      дата_актуализации: 2026-04-28
      статус: требует подтверждения
    этапы:

      - этап: brand / узнаваемость
        задача: сформировать статусное восприятие проекта в узком кругу ЦА
        KPI:
          качество_охвата:
            значение: "не объём, а попадание в узкое ядро (закрытые медиа, премиум-инвентарь)"
            тип_источника: verified-library
            ссылка_или_запрос: "норма этапа: для элита brand важнее лидгена, охват качественный"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "сквозной, ведущий этап для элита"
        типовые_каналы: [dooh, naruzhka, influence, business_media, telegram]
        метрики: [качественный охват, brand-lift в сегменте, доля прямого/брендового трафика]

      - этап: охват / вовлечение
        задача: дотянуться до состоятельной ЦА в релевантном контексте
        KPI:
          цена_качественного_контакта:
            значение: "выше массового сегмента — это норма, не повод резать канал"
            тип_источника: verified-library
            ссылка_или_запрос: "правило: премиум-инвентарь дороже, оценивается по качеству ЦА"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "сквозной"
        типовые_каналы: [yandex_direct_rsya, influence, business_media, telegram, classified_cian]
        метрики: [показы в целевом инвентаре, частота, вовлечённость]

      - этап: лидген / заявка
        задача: получить контакт состоятельного покупателя (часто — звонок, не форма)
        KPI:
          CPL:
            значение: "выше, чем у комфорта — это ожидаемо; контролировать по channels/*"
            тип_источника: verified-library
            ссылка_или_запрос: "library/channels/* — премиум CPL ориентиры [△]"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
          доля_звонков_vs_форм:
            значение: "в премиуме выше доля телефонных обращений (гипотеза под сегмент)"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется разрезом каналов обращения в CRM"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "сквозной, но объём лидов мал — каждый лид дорог"
        типовые_каналы: [yandex_direct_search, classified_cian, influence, callcenter_outbound]
        метрики: [лиды, CPL, доля звонков, целевость обращения]

      - этап: квалификация / персональный контакт
        задача: индивидуальная работа с покупателем, личный менеджер
        KPI:
          доля_доходимости_до_показа:
            значение: "выше при персональном подходе (под пилот)"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется по CRM премиум-сегмента"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "недели"
        типовые_каналы: [callcenter_outbound, messenger_marketing]
        метрики: [конверсия лид→персональный контакт, доходимость до показа]

      - этап: показ / приватный просмотр
        задача: показ шоурума, видовых этажей, индивидуальная презентация
        KPI:
          конверсия_в_бронь:
            значение: "ключевая, сверяется по CRM"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется по воронке CRM"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "недели–месяцы (стадия долгого решения)"
        типовые_каналы: [callcenter_outbound, messenger_marketing]
        метрики: [показы, конверсия показ→бронь, число касаний до решения]
        точка_дожима: "длинная стадия «думает» — персональные касания, не массовый ремаркетинг"

      - этап: бронь → сделка (ДДУ/эскроу или прямой расчёт)
        задача: бронь, оформление; ипотека реже, чаще собственные средства/рассрочка
        KPI:
          лаг_одобрения_если_ипотека:
            значение: "5–15 дней при ипотеке; в элите доля ипотеки ниже"
            тип_источника: verified-library
            ссылка_или_запрос: "этап «одобрение ипотеки» жилой воронки выше в этом файле (library/funnels.yaml)"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "недели"
        типовые_каналы: [callcenter_outbound]
        метрики: [сделки, конверсия бронь→сделка, доля рассрочки/собственных средств]
        примечание: "в элите ипотечный лаг менее критичен — выше доля прямой оплаты и рассрочки от застройщика"

      - этап: ремаркетинг / клуб владельцев
        задача: дожим думающих, работа с лояльностью и рекомендациями
        KPI:
          доля_сделок_по_рекомендации:
            значение: "в премиуме заметна сарафанная доля (под пилот)"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется источником сделки в CRM"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "сквозной"
        типовые_каналы: [messenger_marketing, email, influence]
        метрики: [возвраты, доля рекомендательных сделок]

    absorption_связка: >
      В премиуме absorption медленнее по своей природе — низкий темп НЕ всегда сигнал
      «давить конверсию»; сначала проверь, не норма ли это для класса и локации.
      Резкое «снимаем газ» здесь редко — премиум продаётся ровным брендом.
    комментарий_прохора: >
      Главная ошибка с премиумом — мерить его линейкой комфорта. Тут лидов мало, они
      дорогие, и это нормально: ты платишь за попадание в узкое ядро, а не за объём.
      VK-лид-формы и дешёвый performance сюда почти не работают — ядра ЦА там нет.
      Решает бренд, наружка в правильных местах, закрытые медиа и личный менеджер.
      И не паникуй от медленного absorption: для элита неспешная продажа — часто
      признак здоровья, а не болезни. Дёрнешься в скидки — обесценишь продукт.

  # ============================================================
  # 3. Апарт-комплексы и сервисные апартаменты
  #    Особый юридический и инвестиционный контур — строже юрфильтр 214-ФЗ.
  # ============================================================
  - funnel_id: aparty_servisnye
    тип_объекта: Апарт-комплексы / сервисные апартаменты
    краткое_описание: >
      Два пласта ЦА — «первое доступное жильё» и инвестор. Юридически апартаменты ≠
      квартира, доходность обещать НЕЛЬЗЯ (214-ФЗ/ФАС). Цикл и эскроу — как у жилья,
      но угол на ликвидность локации и управляющую компанию, а не на доход.
    типовая_длительность_сделки:
      значение: "3–6 месяцев; у инвестора решение может быть быстрее (более рациональное)"
      тип_источника: verified-library
      ссылка_или_запрос: "WebSearch: 'цикл сделки апартаменты инвестиции срок 2026'"
      дата_актуализации: 2026-04-28
      статус: требует подтверждения
    юрфильтр_критично:
      значение: "запрет обещаний доходности и прироста цены — СТРОЖЕ, чем у жилья"
      тип_источника: verified-library
      ссылка_или_запрос: "references/moderation-rules.md (надстройка 214-ФЗ), references/pipeline.md этап 3"
      дата_актуализации: 2026-04-28
      статус: требует подтверждения
    этапы:

      - этап: brand / узнаваемость
        задача: объяснить формат (апарты ≠ квартира) и ввести проект в выбор
        KPI:
          охват_и_понимание_формата:
            значение: "охват + доля корректно понявших формат (апарты, не квартира)"
            тип_источника: verified-library
            ссылка_или_запрос: "норма: формат апартов требует объяснения, brand несёт ликбез"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "1–2 месяца на старте"
        типовые_каналы: [yandex_direct_rsya, vk_ads_performance, telegram, business_media]
        метрики: [охват, частота, доля понявших формат]

      - этап: охват / вовлечение
        задача: разделить два потока — «жильё-сегмент» и «инвестор-сегмент»
        KPI:
          сегментация_трафика:
            значение: "разные офферы под жильё-ЦА и инвестора (раздельные кампании)"
            тип_источника: verified-library
            ссылка_или_запрос: "library/audiences.yaml — карточки сегментов инвестор vs первое жильё (триггеры_покупки/барьеры)"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "сквозной"
        типовые_каналы: [yandex_direct_search, yandex_direct_rsya, vk_ads_performance, classified_cian, telegram]
        метрики: [CTR, глубина просмотра, разрез по сегменту оффера]

      - этап: лидген
        задача: собрать заявки по обоим потокам; для инвестора — угол ликвидности/УК
        KPI:
          CPL:
            значение: "контролировать по channels/* (CPC/CPL апарты обычно выше жилья)"
            тип_источника: verified-library
            ссылка_или_запрос: "library/channels/performance.yaml — CPC_апарты [△]"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "сквозной"
        типовые_каналы: [yandex_direct_search, classified_cian, classified_avito, vk_ads_performance, telegram]
        метрики: [лиды, CPL, разрез лидов жильё/инвестор]
        предупреждение_юрфильтра: >
          в лидген-креативе апартов чаще всего и ловится «доходность 14%» — это флаг.
          Угол: «локация с растущим арендным спросом, ассет-менеджмент от УК»,
          без цифр гарантированного дохода.

      - этап: квалификация
        задача: определить мотив (жить / сдавать / перепродать) и вести по нужному сценарию
        KPI:
          точность_сегментации:
            значение: "доля верно квалифицированных по мотиву (под пилот)"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется скриптом квалификации в CRM"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "часы–дни"
        типовые_каналы: [callcenter_outbound, messenger_marketing]
        метрики: [конверсия лид→квал, разрез по мотиву]

      - этап: показ / ВКС
        задача: показ объекта/юнита, для инвестора — экономика аренды от УК (факты, не обещания)
        KPI:
          конверсия_квал_в_бронь:
            значение: "сверяется по CRM"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется по воронке CRM"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "дни–недели"
        типовые_каналы: [messenger_marketing, callcenter_outbound]
        метрики: [показы, конверсия в бронь]
        точка_дожима: "инвестору — кейсы УК и загрузка без обещаний доходности; жильё-ЦА — ипотека и формат"

      - этап: бронь → одобрение ипотеки → ДДУ/эскроу
        задача: бронь и оформление; для апартов по ДДУ через эскроу действуют те же лаги
        KPI:
          лаг_одобрения_ипотеки:
            значение: "5–15 дней; по апартам набор ипотечных программ может быть уже"
            тип_источника: verified-library
            ссылка_или_запрос: "WebSearch: 'ипотека на апартаменты программы условия 2026'"
            дата_актуализации: 2026-04-28
            статус: требует подтверждения
        типовая_длительность: "недели"
        типовые_каналы: [callcenter_outbound, messenger_marketing]
        метрики: [брони, одобрения, сделки/ДДУ]
        примечание: >
          по апартам важно: ипотечные программы и условия отличаются от квартир,
          часть льготных программ может быть недоступна — это закладывается в воронку
          и в креатив (без обещаний «такая же ипотека, как на квартиру»).

      - этап: ремаркетинг / удержание
        задача: дожим инвестора (длинное рациональное решение) и жильё-сегмента
        KPI:
          возврат_инвестора:
            значение: "ориентир под пилот; инвестор дозревает на сравнении вариантов"
            тип_источника: hypothesis
            ссылка_или_запрос: "проверяется сегментом ремаркетинга инвесторов"
            дата_актуализации: 2026-04-28
            статус: гипотеза для A/B
        типовая_длительность: "сквозной"
        типовые_каналы: [yandex_direct_rsya, telegram, email, messenger_marketing]
        метрики: [возвраты, конверсия ремаркетинга в бронь]

    absorption_связка: >
      Темп считается раздельно по жильё-ЦА и инвестору — у них разная скорость
      и разные триггеры. Низкий темп инвест-потока ≠ низкий темп жилья.
    комментарий_прохора: >
      Апарты — самый юридически скользкий объект, и юрфильтр тут жёстче жилья.
      Первое правило: апартаменты — это НЕ квартира, и в любой момент, когда захочется
      написать «доходность 14% годовых», ты получаешь от меня красную ручку и ФАС.
      Доход обещать нельзя — точка. Продаём ликвидность локации, управляющую компанию,
      арендный спрос фактами. Второе: у тебя тут две разные ЦА в одной воронке —
      тот, кто будет жить, и тот, кто будет сдавать. Их нельзя гнать одним оффером:
      первому важна цена входа и формат, второму — экономика и УК. Разделяй потоки
      с этапа охвата, иначе размоешь обоих.

