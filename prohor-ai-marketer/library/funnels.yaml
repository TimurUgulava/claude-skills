      норма, не повод для паники или эйфории. Сравнивай год к году, а не месяц к месяцу.
    комментарий_прохора: >
      Загород — это про «довезти семью до участка». Вся воронка ломается или живёт на
      одном этапе: выезд на объект. Самый красивый таргет бесполезен, если люди не
      доехали посмотреть. Поэтому деньги и усилия — в организацию показов, трансфер,
      удобный слот в выходной. И держи в голове сезонность: мерить absorption загорода
      месяц к месяцу — врать себе, тут только год к году. И не путай схемы оформления:
      организованный посёлок по ДДУ и эскроу — это одно, готовый дом по ДКП — совсем другое.

