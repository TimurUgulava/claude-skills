# =============================================================================
# 4. ОГОВОРКА ПРО ВОРОНКУ И АТРИБУЦИЮ (связь с library/funnels.yaml)
# =============================================================================

funnel_caveat:
  правило: >
    CPL ≠ цена сделки. Цикл первичной сделки 3–9 месяцев с лагом ипотечного
    одобрения (узкое место 5–15 дней) и эскроу/ДДУ. Нельзя оценивать канал по
    лидам первой недели — brand и свой Telegram дозревают через ремаркетинг.
    НЕ убивать канал на второй неделе по «дорогому лиду».
  тип_источника: verified-library
  источник: "модель длинной сделки Прохора (стадии воронок в library/funnels.yaml)"
  дата_актуализации: "2026-04-28"
  статус: "✓"
  комментарий_прохора: >
    Самая частая ошибка при защите медиаплана — зарезать канал по CPL первой
    недели. В первичке лид зреет месяцами. Поэтому CPL читаем вместе с absorption
    и стадией воронки, а не как изолированную цифру.

# =============================================================================
# 5. ПРОТОКОЛ АКТУАЛИЗАЦИИ (как Прохор обновляет эти числа в сессии)
# =============================================================================

actualization_protocol:
  инструмент: "встроенный WebSearch (НЕ Perplexity — его в окружении нет)"
  когда: "на каждой сессии для любого числа с requires_websearch: true"
  что_делает: >
    1) запрос вида «CPL [канал] [тип объекта] [город] 2026»;
    2) если нашёл — переписывает значение, ставит тип_источника: web-search,
       источник: [домен], обновляет дата_актуализации, выводит «было / стало /
       источник / дата / дельта»;
    3) если WebSearch упал или данных нет — остаётся на кэше с честной пометкой
       «по данным на [дата_актуализации], live-обновление недоступно»;
    4) если данных нет нигде — «нет надёжных данных, нужен пилот», цифру не выдумывает.
  запрет: >
    Никогда не подставлять число без источника и статуса. Гарантии доходности,
    точные рублёвые ставки и абсолютные бюджеты кампаний — не выдаются (юрфильтр
    214-ФЗ + ядро доверия). См. references/moderation-rules.md.
