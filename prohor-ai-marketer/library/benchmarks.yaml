      CPL_ЖК_бизнес:
        значение: "3500–9000 ₽"
        тип_источника: hypothesis
        источник: "оценка по логике чека; A/B-проверка"
        дата_актуализации: "2026-04-28"
        статус: "◐"
        requires_websearch: true
