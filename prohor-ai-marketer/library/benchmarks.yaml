        источник: "—"
        дата_актуализации: "2026-04-28"
        статус: "△"
        requires_websearch: true
    комментарий_прохора: >
      Главный соц-канал массового жилья. По премиуму и элиту цифру не даю —
      аудитория в VK для этого ценника тонкая, лид нестабильный, это пилот, а не
