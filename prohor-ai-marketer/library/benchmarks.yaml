        дата_актуализации: "2026-04-28"
        статус: "△"
        requires_websearch: true
      CPC_ЖК_комфорт:
        значение: "80–180 ₽"
        тип_источника: verified-library
        источник: "кэш Прохора на базе кейсов Cossa; подтвердить WebSearch"
        дата_актуализации: "2026-04-28"
        статус: "△"
        requires_websearch: true
      CPL_ЖК_эконом:
        значение: "1200–3500 ₽"
        тип_источника: verified-library
        источник: "кэш Прохора; подтвердить WebSearch на момент сессии"
