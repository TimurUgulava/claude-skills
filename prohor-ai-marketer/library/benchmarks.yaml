        статус: "△"
        requires_websearch: true
    комментарий_прохора: >
      Базовый лидген жилья эконом/комфорт. Для премиума по поиску лид дорогой и
      редкий — там сначала brand, потом добор по тёплым запросам. CPL на апарты и
      бизнес ставлю гипотезой: «дороже лид» — это логика, а не замер, A/B покажет.

  yandex_direct_rsya:
    канал: "Яндекс.Директ — РСЯ (сети)"
    категория: performance
    метрики:
      CPM_ЖК_комфорт:
        значение: "120–350 ₽"
        тип_источника: verified-library
        источник: "кэш Прохора; подтвердить WebSearch"
        дата_актуализации: "2026-04-28"
        статус: "△"
        requires_websearch: true
      CPL_ЖК_комфорт:
        значение: "2000–6000 ₽"
        тип_источника: verified-library
        источник: "кэш Прохора; РСЯ дороже поиска по лиду, но шире охват"
        дата_актуализации: "2026-04-28"
        статус: "△"
        requires_websearch: true
      CTR_ЖК_комфорт:
        значение: "0.3–0.9%"
        тип_источника: hypothesis
        источник: "типичный диапазон сетевых размещений; проверять по кабинету"
        дата_актуализации: "2026-04-28"
        статус: "◐"
        requires_websearch: true
    комментарий_прохора: >
      РСЯ — это про ремаркетинг и догрев, а не про дешёвый первый лид. Не сравнивай
