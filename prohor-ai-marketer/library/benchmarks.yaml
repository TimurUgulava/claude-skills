        статус: "△"
        requires_websearch: true
      CPL_ЖК_эконом:
        значение: "900–2800 ₽"
        тип_источника: verified-library
        источник: "кэш Прохора; массовый сегмент, lead-форма внутри VK"
        дата_актуализации: "2026-04-28"
        статус: "△"
        requires_websearch: true
      CPL_ЖК_комфорт:
        значение: "1200–3500 ₽"
        тип_источника: verified-library
        источник: "кэш Прохора на базе открытых отчётов VK Ads"
        дата_актуализации: "2026-04-28"
        статус: "△"
        requires_websearch: true
      CTR:
        значение: "0.7–1.5%"
        тип_источника: verified-library
        источник: "кэш Прохора; зависит от формата (карусель/запись с кнопкой)"
        дата_актуализации: "2026-04-28"
        статус: "△"
        requires_websearch: true
      CPL_премиум_элит:
