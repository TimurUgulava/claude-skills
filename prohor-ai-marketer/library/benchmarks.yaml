# library/benchmarks.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Стартовые бенчмарки Прохора: CPC / CPL / CPM по каналам × типам объектов
# (диапазоны) + долевые сплиты медиа-микса по типам кампаний и стадиям проекта.
#
# ЯДРО ДОВЕРИЯ. Каждое содержательное число здесь — объект со статусом:
#   { значение, тип_источника, источник, дата_актуализации, статус }
#   тип_источника: verified-library | web-search | hypothesis | object-claim
#   статус:        ✓ (verified) | ◐ (гипотеза для A/B) | △ (требует подтверждения)
#
# ЖЁСТКОЕ ПРАВИЛО (см. references/communication-style.md и SKILL.md):
#   ни одно число не выходит к пользователю без источника и статуса.
#   Где надёжных данных нет — поле явно содержит "нет надёжных данных, требует
#   пилота" вместо выдуманной цифры. Прохор такие позиции НЕ заполняет наугад.
#
# ВАЖНО ПРО АКТУАЛЬНОСТЬ. Это стартовый кэш для офлайна и демо. Рынок digital
# в недвижимости двигается быстро — все диапазоны ниже помечены
# requires_websearch: true и должны актуализироваться через встроенный WebSearch
# на момент сессии (НЕ Perplexity — его в окружении нет). После live-обновления
# Прохор переписывает значение, источник (домен) и дата_актуализации в карточке.
#
# ОХВАТ v1. Жильё (ЖК эконом/комфорт/бизнес/премиум) + апарт-комплексы.
# Коммерция (БЦ, ТРЦ, склады, гостиницы) — ранний контур: где есть хоть какая-то
# опора, число дано со статусом △; где нет — честно "нет надёжных данных".
#
# БЮДЖЕТЫ ТОЛЬКО В ДОЛЯХ. Никаких рублёвых бюджетов кампаний — рынок, гео и стадия
# слишком разные. Абсолютные суммы выдумывать нельзя; даём % сплиты медиа-микса.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  версия: "1.0"
  назначение: >
    Стартовый кэш бенчмарков для офлайн-работы и демо-режима. Покрывает ~80%
    типовых жилых кампаний без обращения к сети; остальное актуализируется живым
    WebSearch на момент сессии.
  валюта: RUB
  единицы:
    CPC: "₽ за клик"
    CPL: "₽ за лид (квалификация лида НЕ гарантирована — см. примечание по воронке)"
    CPM: "₽ за 1000 показов"
    CTR: "доля кликов от показов, %"
  глобальный_дисклеймер: >
    Все числа — диапазоны рынка РФ, СПб/Москва как опорный регион, если не указано
    иное. Регионы обычно дешевле на 20–40% по трафику ([◐ гипотеза для A/B]).
    Каждое значение требует подтверждения через WebSearch на момент кампании.
  типы_источников:
    verified-library: "проверенная позиция библиотеки Прохора"
    web-search: "получено живым WebSearch в сессии, домен указан"
    hypothesis: "рабочая гипотеза, помечена ◐, проверяется A/B-тестом"
    object-claim: "со слов заказчика / из брифа объекта, помечена △"
  статусы:
    "✓": "verified — подтверждённый источник"
    "◐": "гипотеза для A/B — не факт, проверять тестом"
    "△": "требует подтверждения — данные на верификации заказчиком/WebSearch"
  комментарий_прохора: >
    Цифры ниже — это не прайс. Это рамка ожиданий, чтобы не уйти в фантазии на
    защите бюджета перед РОПом. На сессии я каждую переспрашиваю у сети: упала
    цифра — переписал карточку, не упала — иду по кэшу и честно говорю «по данным
    на такую-то дату».

# =============================================================================
# 1. БЕНЧМАРКИ ПО КАНАЛАМ × ТИПАМ ОБЪЕКТОВ
#    Структура карточки метрики:
#      <метрика_id>:
#        значение: <диапазон или "нет надёжных данных, требует пилота">
#        тип_источника: verified-library | web-search | hypothesis | object-claim
#        источник: <домен / запрос / "со слов заказчика">
#        дата_актуализации: YYYY-MM-DD
#        статус: "✓" | "◐" | "△"
#        requires_websearch: true|false
# =============================================================================

channel_benchmarks:

