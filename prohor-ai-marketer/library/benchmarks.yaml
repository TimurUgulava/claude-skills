        статус: "△"
        requires_websearch: true
      CPL_ЖК_бизнес:
        значение: "3000–9000 ₽"
        тип_источника: hypothesis
        источник: "оценка по логике «выше чек → дороже лид»; A/B-проверка обязательна"
        дата_актуализации: "2026-04-28"
        статус: "◐"
        requires_websearch: true
      CPL_апарты:
        значение: "2500–7000 ₽"
        тип_источника: hypothesis
        источник: "оценка; инвест-аудитория дороже семейной, проверять A/B"
        дата_актуализации: "2026-04-28"
        статус: "◐"
        requires_websearch: true
      CPL_БЦ_классА:
        значение: "8000–20000 ₽"
        тип_источника: hypothesis
        источник: "B2B-аренда, длинная сделка; ранний контур, верификация WebSearch"
