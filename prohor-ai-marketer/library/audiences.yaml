# СКЛАДЫ A/B КЛАССА И LIGHT INDUSTRIAL  —  чистый B2B
# ════════════════════════════════════════════════════════════════════════════
warehouse:
  тип_объекта: Склады A/B класса, light industrial
  статус_контура: ранний контур (B2B) — требует отраслевой верификации перед боем
  логика: метрика — снижение вакантности и LTV арендатора, узкие точные каналы
  сегменты:

    - segment_id: warehouse_logistics_tenant
      название: Логистический/торговый арендатор склада
      тип_объекта: Склад A/B класса / light industrial
      jobs_to_be_done:
        - разместить товарные запасы и логистику в подходящем по классу складе
        - получить нужную высоту/полы/доковые ворота под операции
        - встать в локации с удобной транспортной/ж-д доступностью
      триггеры_покупки:
        - класс склада и тех. параметры (высота потолков, нагрузка на пол, доки)
        - локация: близость к трассам/ж-д ветке/городу
        - готовность к въезду и инженерная инфраструктура
        - ставка аренды за м²/год и гибкость площади
      барьеры:
        - несоответствие тех. параметров операциям арендатора
        - удалённость от потребителя/логистических узлов
        - длинный B2B-цикл и капитальность переезда складских операций
      типовые_возражения:
        - «потолки/полы не под наше оборудование»
        - «далеко от наших маршрутов доставки»
        - «ставка высокая для этой локации»
      профиль_ЛПР:
        роль:
          значение: "директор по логистике / операционный директор / собственник бизнеса"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'кто выбирает складскую недвижимость B2B 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
        цикл_решения:
          значение: "длинный, капитальный — переезд склада дорог; не оценивать канал по первым лидам"
          тип_источника: object-claim
          ссылка_или_запрос: "см. library/funnels.yaml"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      платежеспособность:
        метрика:
          значение: "ставка аренды за м²/год класса A/B и LTV арендатора"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'ставка аренды склад класс A [регион] 2026 руб м2'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
      приоритетные_каналы: [yandex_direct_search]
      комментарий_прохора: >
        Ранний контур, чистый B2B, самый узкий спрос из всех. Тут не «креативы для
        ленты», а точное попадание тех. параметров и локации в операции арендатора.
        Канал — поиск по горячему запросу и отраслевые B2B-каталоги (последние — v2).
        Метрика успеха: снижение вакантности, а не дешёвый лид.
