# ЖК ЭКОНОМ-КЛАСС
# ════════════════════════════════════════════════════════════════════════════
zhk_econom:
  тип_объекта: ЖК (эконом-класс)
  стадия_релевантности: котлован → монолит → сдача (цена входа — главный аргумент)
  сегменты:

    - segment_id: econom_first_home_renters
      название: Съёмщики, выходящие из аренды в первое своё жильё
      тип_объекта: ЖК эконом
      jobs_to_be_done:
        - перестать платить за чужую квартиру и начать платить за свою
        - зафиксировать платёж, который не поднимет арендодатель
        - получить «точку на карте», прописку, ощущение взрослой опоры
      триггеры_покупки:
        - ипотечный платёж сопоставим с текущей арендой (арифметика «снимаешь vs платишь за своё»)
        - льготная/семейная ипотека снижает порог входа
        - старт продаж по минимальной цене котлована
        - страх роста аренды и цен «куплю сейчас, потом дороже»
      барьеры:
        - нет накоплений на первоначальный взнос
        - страх не потянуть платёж при потере дохода
        - «дом ещё не построен» — недоверие к стройке и срокам
        - юридический страх ДДУ/эскроу у первого покупателя
      типовые_возражения:
        - «а вдруг застройщик не достроит»
        - «у меня нет на первый взнос»
        - «лучше пока поснимаю, не готов на 20 лет в кредит»
        - «далеко от метро / долго до работы»
      демография:
        возраст:
          значение: "ориентир 25–35 лет"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет покупателя новостройки эконом первое жильё 2026 возраст'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        состав:
          значение: "одиночки и пары без детей / с одним маленьким ребёнком"
          тип_источника: object-claim
          ссылка_или_запрос: "сверить с CRM заказчика по фактическим сделкам"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
        мотив_формат:
          значение: "студии и 1-комнатные / евро-1 как стартовый продукт"
          тип_источника: hypothesis
          ссылка_или_запрос: "проверяется разрезом квартирографии проданных лотов"
          дата_актуализации: 2026-04-28
          статус: гипотеза для A/B
      платежеспособность:
        бюджет:
          значение: "минимальная вилка класса, чувствительность к цене высокая"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'средний бюджет покупки квартиры эконом класс [город] 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        инструменты:
          значение: "ипотека ~основной инструмент; первый взнос — узкое место; маткапитал на ПВ"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'доля ипотечных сделок новостройки эконом 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [vk_ads_performance, mytarget, yandex_direct_search]
      комментарий_прохора: >
        Это ядро эконома — человек, которому надоело кормить чужую ипотеку своей арендой.
        Бей в арифметику «платёж vs аренда» и в первый взнос — взнос, а не ставка, чаще
        останавливает сделку. Только без обещаний «инвестируй и заработай»: это первое
        жильё для жизни, а не актив, и 214-ФЗ доходность тут зарежет на модерации.

    - segment_id: econom_maternal_capital_family
      название: Семьи с маткапиталом, расширяющие площадь
      тип_объекта: ЖК эконом
      jobs_to_be_done:
        - превратить маткапитал и накопления в реальные квадратные метры
        - переехать из тесноты/коммуналки/с родителями в отдельное жильё
        - успеть зайти в ипотеку, пока действует семейная программа
      триггеры_покупки:
        - семейная ипотека + маткапитал закрывают первый взнос
        - евро-планировка даёт «вторую комнату» в том же бюджете
        - двор без машин и площадки — безопасность ребёнка
        - дедлайн программы господдержки
      барьеры:
        - сложная схема использования маткапитала, страх «сделать неправильно»
        - доход на семью не проходит под платёж
        - «школа/садик далеко» — инфраструктурный страх
        - срок сдачи дальше, чем готовы ждать с ребёнком
      типовые_возражения:
        - «а маткапитал точно примут на этот объект»
        - «нам бы готовое, ждать стройку с ребёнком тяжело»
        - «двушка маловата, а на трёшку не хватает»
      демография:
        возраст:
          значение: "ориентир 28–40 лет, есть дети"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'семейная ипотека портрет заёмщика 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        состав:
          значение: "семья с 1–2 детьми"
          тип_источника: object-claim
          ссылка_или_запрос: "сверить с CRM заказчика"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      платежеспособность:
        бюджет:
          значение: "низ-середина класса; маткапитал как часть ПВ"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'размер материнского капитала 2026 доля в первом взносе'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        инструменты:
          значение: "семейная ипотека + маткапитал; иногда обмен старого жилья (trade-in)"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'условия семейной ипотеки 2026 ставка'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [mytarget, vk_ads_performance, yandex_direct_search]
      комментарий_прохора: >
        Сильный, но капризный сегмент. Триггер — не «дёшево», а «влезаем в семейную +
        маткапитал и получаем вторую комнату». Барьер почти всегда инфраструктурный:
        мать первым делом спросит про садик и школу, а не про фасад. Дашь честный ответ
        по срокам инфраструктуры — закроешь половину возражений. Точную ставку в креатив
        не вписываем без условий банка — это юрфильтр зарежет.


