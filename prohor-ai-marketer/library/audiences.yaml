# ЖК ПРЕМИУМ-КЛАСС
# ════════════════════════════════════════════════════════════════════════════
zhk_premium:
  тип_объекта: ЖК (премиум-класс)
  стадия_релевантности: монолит → сдача (продукт и видовые лоты, не цена)
  сегменты:

    - segment_id: premium_status_buyers
      название: Покупатели статусного жилья «для себя»
      тип_объекта: ЖК премиум
      jobs_to_be_done:
        - получить выдающийся продукт: вид, высоту потолков, видовые террасы
        - жить в управляемой среде с высоким сервисом
        - выразить вкус и статус через нестандартный, узнаваемый дом
      триггеры_покупки:
        - уникальная локация и видовые характеристики (вода, центр, парк)
        - бренд архитектора/девелопера и узнаваемость проекта
        - сервис и управляющая компания премиум-уровня
        - ограниченность предложения (мало таких лотов)
      барьеры:
        - длительный выбор, сравнение с конкурирующими премиум-проектами
        - требование «всё идеально» — нетерпимость к компромиссам
        - закрытость сегмента — не реагирует на массовую рекламу
      типовые_возражения:
        - «есть проект интереснее по локации»
        - «УК справится с уровнем сервиса, который обещаете»
        - «вид не загородят следующей очередью»
      демография:
        профиль:
          значение: "ориентир 35–55 лет, высокий доход, часто не первая недвижимость"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет покупателя премиум новостройки 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
      платежеспособность:
        бюджет:
          значение: "очень высокая; покупка часто без ипотеки"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'доля сделок без ипотеки премиум жильё 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
        инструменты:
          значение: "собственные средства / рассрочка; ипотека как опция, не необходимость"
          тип_источника: hypothesis
          ссылка_или_запрос: "проверяется структурой оплаты в CRM"
          дата_актуализации: 2026-04-28
          статус: гипотеза для A/B
      приоритетные_каналы: [cian, yandex_direct_search]
      комментарий_прохора: >
        Премиум не ловится массовым таргетом — VK-лидформа тут бесполезна, ядра нет.
        Это персональная работа: точечные каналы, classified-премиум, инфлюенс, прямой
        контакт. Триггер — продукт и видовая исключительность, а возражение почти всегда
        «есть вариант интереснее». Поэтому концепция строится на том, что у этого дома
        реально уникально и невоспроизводимо у соседей, а не на «акции до конца месяца».


