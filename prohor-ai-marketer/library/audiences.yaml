# ТРЦ / РАЙОННЫЕ ТЦ / СТРИТ-РИТЕЙЛ  —  ДВА разных заказчика: B2C-трафик и B2B-лизинг
# ════════════════════════════════════════════════════════════════════════════
trc_retail:
  тип_объекта: Торговые центры (ТРЦ), районные ТЦ, стрит-ритейл первых этажей
  статус_контура: ранний контур — требует отраслевой верификации перед боем
  логика: >
    Под ТРЦ живут ДВЕ независимые кампании. (1) B2C — привлечение трафика посетителей
    (метрика: посещаемость, трафик в дни акций). (2) B2B — лизинг площадей арендаторам
    (метрика: вакантность, tenant-mix). Прохор на старте уточняет, какая задача.
  сегменты:

    - segment_id: trc_b2c_visitor
      название: Посетитель ТРЦ (B2C-трафик)
      тип_объекта: ТРЦ / районный ТЦ
      jobs_to_be_done:
        - провести выходной/досуг всей семьёй в одном месте
        - закрыть покупки и сервис «за один заезд»
        - сходить в кино/поесть/развлечь детей рядом с домом
      триггеры_покупки:
        - событие/акция/распродажа с дедлайном
        - якорные арендаторы и развлечения (кино, фудкорт, детская зона)
        - близость к дому (для районного ТЦ) и удобный паркинг
        - сезонный повод (праздники, школьный сезон)
      барьеры:
        - конкуренция с маркетплейсами и онлайн-шопингом
        - конкурирующие ТЦ ближе/удобнее
        - «нечего там делать, всё есть онлайн»
      типовые_возражения:
        - «закажу то же самое на маркетплейсе дешевле»
        - «далеко ехать ради магазинов»
      профиль_аудитории:
        ядро:
          значение: "семьи и молодёжь в радиусе охвата ТЦ (для районного — пешая/10–15 мин)"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'радиус охвата районного ТЦ посещаемость 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [vk_ads_performance, yandex_direct_rsya, mytarget]
      комментарий_прохора: >
        Ранний контур. B2C-трафик ТРЦ — это геотаргет по радиусу и события с дедлайном,
        а не имидж. Главный конкурент сегодня не соседний ТЦ, а маркетплейс: продавай
        то, что нельзя заказать домой — досуг, кино, фудкорт, «выйти из дома».

    - segment_id: trc_b2b_tenant
      название: Арендатор площади в ТРЦ (B2B-лизинг)
      тип_объекта: ТРЦ / стрит-ритейл
      jobs_to_be_done:
        - открыть точку там, где есть гарантированный трафик целевого покупателя
        - попасть в удачное соседство (tenant-mix) и к якорю
        - получить условия аренды, которые окупит оборот точки
      триггеры_покупки:
        - доказанная посещаемость и портрет трафика ТЦ
        - сильный пул якорных арендаторов и удачный tenant-mix
        - условия входа (арендные каникулы, % с оборота)
        - локация секции/этажа и трафик у входа
      барьеры:
        - риск низкой проходимости и убыточной точки
        - высокая ставка vs неопределённый оборот
        - сомнение в управлении и маркетинге самого ТЦ
      типовые_возражения:
        - «какой реальный трафик, а не из презентации»
        - «ставка не отобьётся оборотом»
        - «кто соседи, не отпугнут ли мою аудиторию»
      профиль_ЛПР:
        роль:
          значение: "владелец/директор сети ритейла или франчайзи; B2B-цикл с переговорами"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'как арендаторы выбирают площадь в ТРЦ 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [yandex_direct_search]
      комментарий_прохора: >
        Ранний контур и совсем другая кампания, чем трафик посетителей. Арендатор
        покупает доказанный трафик и tenant-mix, а не «красивый ТЦ». Презентационным
        цифрам он не верит — нужна реальная посещаемость. Полный B2B-инструментарий
        лизинга (NOI, вакантность, отраслевые каталоги) — это v2.


# ════════════════════════════════════════════════════════════════════════════
# ГОСТИНИЦЫ И АПАРТ-ОТЕЛИ
# ════════════════════════════════════════════════════════════════════════════
hotels:
  тип_объекта: Гостиницы и апарт-отели
  статус_контура: ранний контур — требует отраслевой верификации перед боем
  логика: >
    Две стороны: B2C — заполняемость номеров (метрика загрузка/ADR), B2B/инвест —
    продажа юнитов апарт-отеля инвесторам под управление оператора.
  сегменты:

    - segment_id: hotel_b2c_guest
      название: Гость гостиницы / апарт-отеля (заполняемость)
      тип_объекта: Гостиница / апарт-отель
      jobs_to_be_done:
        - удобно и предсказуемо разместиться в поездке (туризм/командировка)
        - получить сервис и локацию под цель визита
        - забронировать без риска и сюрпризов
      триггеры_покупки:
        - локация под цель поездки (центр/деловой узел/у достопримечательностей)
        - рейтинг и отзывы, понятный сервис
        - цена под сезон и спецпредложения
        - наличие на нужные даты в агрегаторах бронирования
      барьеры:
        - сезонность спроса, провалы загрузки
        - сильная конкуренция по цене на агрегаторах
        - сомнение в качестве по фото/отзывам
      типовые_возражения:
        - «дорого для этих дат»
        - «по фото непонятно, что по факту»
      профиль_аудитории:
        ядро:
          значение: "туристы и командировочные; сегмент зависит от типа отеля и локации"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'загрузка гостиниц ADR [город] 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [yandex_direct_search, yandex_direct_rsya, vk_ads_performance]
      комментарий_прохора: >
        Ранний контур. B2C-гостиница живёт на агрегаторах бронирования и сезонности —
        перформанс догоняет прямые брони, но ядро спроса в каналах бронирования.
        Полноценные booking-каналы (Островок, Яндекс Путешествия) подключаем в v2.

    - segment_id: hotel_unit_investor
      название: Инвестор в юнит апарт-отеля под управление оператора
      тип_объекта: Апарт-отель
      jobs_to_be_done:
        - купить юнит, которым управляет гостиничный оператор, и получать долю дохода
        - войти в гостиничный бизнес без операционной нагрузки
      триггеры_покупки:
        - имя и опыт гостиничного оператора
        - локация с туристическим/деловым спросом
        - формат «купил — оператор управляет»
      барьеры:
        - доходность обещать нельзя (тот же запрет)
        - зависимость дохода от загрузки и сезона
        - апарт-отель ≠ квартира по статусу
      типовые_возражения:
        - «гарантируете доход» (нельзя — только диапазон со ссылкой)
        - «а если оператор не наберёт загрузку»
      профиль_аудитории:
        ядро:
          значение: "инвестор с капиталом, ищущий управляемый доходный актив"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет инвестора апарт-отель оператор 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [yandex_direct_search, yandex_direct_rsya, cian]
      комментарий_прохора: >
        Ранний контур и снова минное поле доходности — те же правила, что у доходных
        апартов. Угол на имя оператора и локацию, доходность только диапазоном со
        ссылкой, без гарантий. Статус «не квартира» проговариваем.


