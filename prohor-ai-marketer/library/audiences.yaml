# Библиотека сегментов ЦА Прохора — audiences.yaml
#
# Назначение: Прохор не сочиняет «среднего покупателя из головы» — он берёт сегменты
# из этой библиотеки под конкретный тип объекта, спорит с пользователем о приоритетах
# (этап 1 пайплайна) и тянет триггеры/барьеры в креативные углы (этап 2–3).
#
# ──────────────────────────────────────────────────────────────────────────────
# Анти-галлюцинационный контракт (ядро доверия):
#   Демография и платёжеспособность — это РЫНОЧНЫЕ ориентиры, не паспорт конкретного
#   объекта. Любое число несёт объект {значение, тип_источника, ссылка_или_запрос,
#   дата_актуализации, статус}. Статусы в этом файле:
#     - "требует актуализации через WebSearch" — диапазон/доля взяты из открытых
#       обзоров рынка на дату актуализации; перед выдачей клиенту Прохор обновляет
#       живым WebSearch под город и класс объекта.
#     - "гипотеза для A/B" — рабочее предположение о сегменте/триггере, проверяется
#       тестом, не подаётся клиенту как факт.
#     - "требует подтверждения" — собранное/отраслевое утверждение, которое заказчик
#       должен сверить со своей CRM и портретом реальных покупателей объекта.
#   Нет надёжных данных по сегменту → пишем "нет надёжных данных, нужен анализ CRM",
#   сегмент не выдаём как готовый.
#
#   Триггеры_покупки и барьеры — отраслевая фактура (JTBD-логика рынка), а НЕ обещания.
#   Любой триггер, попадающий в текст креатива, проходит юрфильтр 214-ФЗ на этапе 3:
#   доходность/прирост цены не обещаем, «апартаменты ≠ квартира» разводим, цену/ипотеку
#   даём только с условиями. См. references/moderation-rules.md и юрнадстройку.
#
# ──────────────────────────────────────────────────────────────────────────────
# Каноническая схема карточки сегмента:
#   - segment_id:            машинный id (латиница, snake_case)
#     название:              человекочитаемое имя сегмента
#     тип_объекта:           к какому типу объекта относится
#     jobs_to_be_done:       какую «работу» нанимают объект сделать (язык JTBD)
#     триггеры_покупки:      что толкает к решению (отраслевые, не обещания)
#     барьеры:               что тормозит/останавливает покупку
#     типовые_возражения:    реплики, которые слышит отдел продаж
#     демография:            ориентир-портрет (поля со статусом источника)
#     платежеспособность:    бюджетная вилка и инструменты оплаты (со статусом)
#     приоритетные_каналы:   подсказка для этапа медиа-микса (id из channels/*.yaml)
#     комментарий_прохора:   живая реплика — где сегмент полезен, где ловушка
#
# Покрытие v1 (рабочее ядро, выверено): ЖК эконом/комфорт/бизнес/премиум/элит,
#   апарт-комплексы и сервисные апартаменты.
# Ранний контур (каркас есть, помечен — требует отраслевой верификации перед боем):
#   БЦ класса A, ТРЦ/стрит-ритейл, гостиницы/апарт-отели, склады/light industrial.
#   Для коммерции демография заменена на профиль ЛПР/арендатора — это B2B-логика.

meta:
  версия: 1.0
  дата_сборки: 2026-04-28
  голос_данных: профэталон (сухие данные), комментарий_прохора — нарратив
  важно: >
    Демография/платёжеспособность — рыночный ориентир под актуализацию, НЕ факт об
    объекте. Реальный портрет покупателя берётся из CRM заказчика и помечается
    "требует подтверждения" до сверки.


