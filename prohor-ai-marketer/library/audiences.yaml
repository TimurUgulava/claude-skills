# ЖК КОМФОРТ-КЛАСС  (ядро v1 — на нём работает наш демо-объект)
# ════════════════════════════════════════════════════════════════════════════
zhk_comfort:
  тип_объекта: ЖК (комфорт-класс)
  стадия_релевантности: котлован → монолит → отделка → сдача (баланс цена/готовность)
  сегменты:

    - segment_id: comfort_young_family
      название: Молодая семья, переезд из аренды/первого жилья в комфорт
      тип_объекта: ЖК комфорт
      jobs_to_be_done:
        - дать ребёнку безопасный двор и школу/садик в пешей доступности
        - получить честную евро-планировку под жизнь семьи, а не «комнаты-пеналы»
        - закрепиться в районе на годы, а не на «перекантоваться»
      триггеры_покупки:
        - двор без машин, закрытый квартал, детские площадки
        - своя школа/садик внутри квартала (к сдаче очереди)
        - евро-двушка/евро-трёшка — кухня-гостиная как сердце семьи
        - семейная ипотека делает платёж подъёмным
        - «успеть купить и въехать до 1 сентября» (школьный дедлайн)
      барьеры:
        - «двор не станет ли парковкой по факту» — недоверие к обещанию
        - инфраструктура (школа/садик) только «к сдаче 2-й очереди» — ждать
        - доход на семью под платёж комфорта впритык
        - срок сдачи vs «ребёнку в школу уже сейчас»
      типовые_возражения:
        - «обещаете двор без машин, а по факту всё заставят»
        - «школа будет только через два года, а нам сейчас»
        - «в соседнем ЖК дешевле метр»
        - «евро-планировка — это маркетинг, кухня же проходная»
      демография:
        возраст:
          значение: "ориентир 28–40 лет"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет покупателя ЖК комфорт-класс 2026 возраст состав семьи'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        состав:
          значение: "семья с детьми дошкольного/школьного возраста"
          тип_источника: object-claim
          ссылка_или_запрос: "сверить с CRM заказчика по проданным евро-2/евро-3"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
        формат_спроса:
          значение: "евро-двушки и евро-трёшки — основной семейный продукт комфорта"
          тип_источника: hypothesis
          ссылка_или_запрос: "проверяется квартирографией продаж (доля евро-планировок)"
          дата_актуализации: 2026-04-28
          статус: гипотеза для A/B
      платежеспособность:
        бюджет:
          значение: "середина класса; для СПб комфорт — ориентир по прайсу объекта"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'цена м2 комфорт класс СПб Приморский район 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        инструменты:
          значение: "семейная ипотека ~основной драйвер; trade-in старой квартиры"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'доля семейной ипотеки в продажах комфорт-класса 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [yandex_direct_search, vk_ads_performance, yandex_direct_rsya]
      комментарий_прохора: >
        Главный сегмент комфорта и базовый для нашего демо-объекта. Здесь решает не цена
        метра, а связка «безопасный двор + школа в пешей + честная евро-планировка».
        Самый острый барьер — недоверие к обещанию двора без машин: его закрывают не
        словами, а визуалом реального двора и цифрой машино-мест. Школьный дедлайн «к
        1 сентября» — мощный сезонный триггер, но честный: если инфраструктура только
        ко 2-й очереди — так и говорим, иначе получим разочарованного покупателя и отзыв.

    - segment_id: comfort_upgraders
      название: Апгрейдеры — улучшают жильё внутри города
      тип_объекта: ЖК комфорт
      jobs_to_be_done:
        - сменить старую/вторичку на новый дом без потери в локации
        - получить больше площади и нормальную планировку под выросшую семью
        - переехать в «свой» район с набережной/парком, а не в спальник
      триггеры_покупки:
        - продают вторичку и доплачивают — trade-in закрывает часть цены
        - видовые квартиры (залив, набережная) как эмоциональный апгрейд
        - закрытый квартал и благоустройство «как у людей»
        - готовность дома близка — переезд предсказуем
      барьеры:
        - «пока продам свою — цена тут вырастет» (рассинхрон сделок)
        - привязка к старому району (школа, родители, привычки)
        - сомнение, что комфорт реально лучше их обжитой вторички
      типовые_возражения:
        - «у меня хорошая квартира, зачем менять»
        - «продам старую — а на новую уже не хватит»
        - «отделка white-box — ещё и ремонт вкладывать»
      демография:
        возраст:
          значение: "ориентир 33–48 лет"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'апгрейд жилья портрет покупателя комфорт 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        состав:
          значение: "сложившиеся семьи, есть имущество для trade-in"
          тип_источника: object-claim
          ссылка_или_запрос: "сверить с CRM (сделки с зачётом вторички)"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      платежеспособность:
        бюджет:
          значение: "середина-верх класса; часть цены закрывает вторичка"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'доля trade-in сделок новостройки 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        инструменты:
          значение: "trade-in + ипотека/доплата; меньше зависят от льготных программ"
          тип_источника: hypothesis
          ссылка_или_запрос: "проверяется долей сделок с зачётом в CRM"
          дата_актуализации: 2026-04-28
          статус: гипотеза для A/B
      приоритетные_каналы: [yandex_direct_search, yandex_direct_rsya, cian]
      комментарий_прохора: >
        Недооценённый, но платёжеспособный сегмент: у него уже есть актив для trade-in,
        и он меньше висит на льготной ипотеке. Главный тормоз — рассинхрон «продам свою /
        куплю новую» и страх, что за время продажи цена уедет. Дай ему понятную схему
        trade-in и фиксацию цены — снимешь главный барьер. Видовые лоты на залив — его
        эмоциональный крючок, бей картинкой вида, а не ценой.

    - segment_id: comfort_investor_rent
      название: Частный инвестор «под аренду / сохранить деньги»
      тип_объекта: ЖК комфорт
      jobs_to_be_done:
        - переложить накопления из депозита/налички в понятный физический актив
        - получить ликвидный лот, который легко сдать или перепродать
        - зайти на котловане дешевле и выйти ближе к сдаче
      триггеры_покупки:
        - ликвидная локация с арендным спросом (метро рядом, набережная, рабочие места)
        - студии и евро-1 — самый ходовой арендный/перепродажный формат
        - вход на ранней стадии по цене котлована
        - аккредитация в крупных банках, эскроу — снижает риск
      барьеры:
        - закон запрещает обещать доходность — инвестор хочет цифру, а её нельзя давать
        - длинный цикл и лаг эскроу/ДДУ — деньги «заморожены» до сдачи
        - конкуренция с депозитом и другими активами
        - риск переоценки арендной ставки района
      типовые_возражения:
        - «а сколько я заработаю» (на который честно нельзя ответить гарантией)
        - «деньги на эскроу лежат без процентов, лучше депозит»
        - «студий тут много — кому я потом сдам/продам»
      демография:
        профиль:
          значение: "ориентир 30–55 лет, есть свободный капитал/накопления"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет частного инвестора в новостройки 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        мотив:
          значение: "сохранение капитала + аренда; не профессиональный рантье"
          тип_источника: hypothesis
          ссылка_или_запрос: "проверяется опросом/квалификацией в CRM"
          дата_актуализации: 2026-04-28
          статус: гипотеза для A/B
      платежеспособность:
        бюджет:
          значение: "часто покупка без ипотеки или с малым плечом; чувствителен к цене входа"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'доля инвестиционных сделок новостройки комфорт 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
        инструменты:
          значение: "собственные средства / рассрочка от застройщика; реже ипотека"
          тип_источника: object-claim
          ссылка_или_запрос: "сверить с CRM по способу оплаты студий/евро-1"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [yandex_direct_search, yandex_direct_rsya, cian]
      комментарий_прохора: >
        Самый юридически опасный сегмент в текстах. Инвестор хочет услышать «доходность
        N%» — а 214-ФЗ и ФАС это прямо запрещают по жилью и тем более по апартам. Поэтому
        угол строим на ликвидности: локация с растущим арендным спросом, ходовой формат,
        цена входа на котловане. Никаких «заработай на перепродаже». И честно про лаг
        эскроу: деньги работают на стройку, не на депозит — это не минус, а структура
        сделки, но проговаривать надо, иначе инвестор уйдёт обиженным.


