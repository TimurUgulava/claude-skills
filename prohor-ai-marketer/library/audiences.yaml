# АПАРТ-КОМПЛЕКСЫ И СЕРВИСНЫЕ АПАРТАМЕНТЫ  (ядро v1, повышенная юр-осторожность)
# ════════════════════════════════════════════════════════════════════════════
aparty:
  тип_объекта: Апарт-комплексы и сервисные апартаменты
  стадия_релевантности: котлован → сдача
  юр_примечание: >
    Апартаменты юридически НЕ жильё. На этапе 3 обязателен усиленный юрфильтр:
    разводим «апартаменты ≠ квартира» (нет прописки/иной статус), категорически
    не обещаем доходность и прирост цены, доходные программы УК подаём без гарантий.
  сегменты:

    - segment_id: aparty_investor_yield
      название: Инвестор в доходные апартаменты (rental)
      тип_объекта: Апарт-комплекс (сервисные/доходные)
      jobs_to_be_done:
        - получить актив, который управляющая компания сдаёт за инвестора
        - войти в недвижимость с меньшим чеком, чем квартира
        - диверсифицировать капитал в управляемый «пассивный» формат
      триггеры_покупки:
        - управляющая компания берёт аренду на себя (ассет-менеджмент)
        - ликвидная локация с устойчивым арендным/туристическим спросом
        - меньший порог входа, чем у квартиры в той же локации
        - готовая меблировка и формат «купил — сдал»
      барьеры:
        - закон запрещает обещать доходность — инвестор требует цифру
        - апартаменты ≠ квартира: выше налоги/комуналка, нет прописки
        - страх «УК не обеспечит загрузку»
        - переоценка туристического/арендного спроса локации
      типовые_возражения:
        - «какая гарантированная доходность» (ответ — только диапазон рынка со ссылкой, без гарантии)
        - «коммуналка и налог выше, чем на квартиру»
        - «а если УК не сдаст — я плачу за простой»
      демография:
        профиль:
          значение: "ориентир 30–55 лет, есть капитал, ищет управляемый доход"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет инвестора в апартаменты доходные 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
      платежеспособность:
        бюджет:
          значение: "часто собственные средства; чувствителен к чеку входа"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'средний чек апартаменты инвестиционные [город] 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        инструменты:
          значение: "собственные средства / рассрочка; ипотека на апарты дороже жилой"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'ипотека на апартаменты условия 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [yandex_direct_search, yandex_direct_rsya, cian]
      комментарий_прохора: >
        Самый минный сегмент во всём скилле. Инвестор ждёт «доходность 14% годовых» —
        и это ровно та фраза, которую я зарежу красной ручкой на этапе 3. По закону
        доходность не обещаем, точка. Легальный угол: ликвидная локация + растущий
        арендный спрос + ассет-менеджмент от УК, диапазон рынка даём только со ссылкой
        и долей в процентах как ориентир. И обязательно разводим «апартаменты ≠ квартира»:
        если инвестор думает, что покупает жильё с пропиской — это будущая претензия.

    - segment_id: aparty_lifestyle_user
      название: Покупатель «для себя» — второй дом / pied-à-terre
      тип_объекта: Сервисные апартаменты
      jobs_to_be_done:
        - иметь городскую базу рядом с работой/центром без забот о быте
        - получить гостиничный сервис при своём жилье
        - сократить дорогу: жить в будни ближе к делам
      триггеры_покупки:
        - сервис как в отеле (уборка, ресепшн, безопасность)
        - локация в деловом/центральном узле
        - формат «заехал и живёшь» — меблировка, минимум хлопот
        - компактный формат под одного/пару
      барьеры:
        - нет прописки и иной правовой статус
        - выше эксплуатационные расходы
        - «это же не настоящая квартира»
      типовые_возражения:
        - «без прописки зачем оно мне»
        - «сервис УК — это допрасходы каждый месяц»
      демография:
        профиль:
          значение: "ориентир 28–45 лет, мобильные, работа в центре, часто одиночки/пары"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет покупателя сервисных апартаментов для себя 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      платежеспособность:
        бюджет:
          значение: "средне-высокая; платит за локацию и сервис"
          тип_источника: hypothesis
          ссылка_или_запрос: "проверяется структурой спроса по типам апартов в CRM"
          дата_актуализации: 2026-04-28
          статус: гипотеза для A/B
      приоритетные_каналы: [yandex_direct_search, yandex_direct_rsya]
      комментарий_прохора: >
        Этот покупает не актив, а образ жизни «база в центре + ноль быта». Доходность
        ему вторична, поэтому и юр-риск ниже — но статус «не квартира» всё равно
        проговариваем честно, чтобы прописка не стала сюрпризом. Угол — сервис и
        локация, а не инвестиция.


