# ЖК ЭЛИТ-КЛАСС
# ════════════════════════════════════════════════════════════════════════════
zhk_elite:
  тип_объекта: ЖК (элит-класс)
  стадия_релевантности: на всём цикле — продукт штучный, спрос узкий и закрытый
  сегменты:

    - segment_id: elite_capital_preservation
      название: Капитал «для семьи и сохранения», узкий закрытый круг
      тип_объекта: ЖК элит
      jobs_to_be_done:
        - получить уникальный, штучный объект в лучшей локации города
        - сохранить и передать капитал в надёжном активе
        - приватность, безопасность, закрытость от посторонних
      триггеры_покупки:
        - эксклюзивность локации и архитектуры (нет аналогов)
        - максимальная приватность и безопасность
        - имя девелопера и репутация управляющей компании
        - персональный сервис на этапе сделки
      барьеры:
        - закрытость: реклама почти не работает, решает рекомендация и брокер
        - сверхвысокие требования к каждой детали
        - конфиденциальность сделки превыше всего
      типовые_возражения:
        - «кто ещё здесь живёт» (вопрос окружения и приватности)
        - «гарантии конфиденциальности сделки»
      демография:
        профиль:
          значение: "узкий круг сверхвысокого дохода; рекламные каналы вторичны к личным"
          тип_источника: object-claim
          ссылка_или_запрос: "сверить с реальной базой брокеров заказчика"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      платежеспособность:
        бюджет:
          значение: "не ограничивающий фактор; цена не аргумент"
          тип_источника: object-claim
          ссылка_или_запрос: "не оценивается публичными бенчмарками — индивидуально"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [cian]
      комментарий_прохора: >
        Честно: элит — это не про медиа-микс, а про брокеров, рекомендации и личный
        контакт. Массовая реклама тут скорее вредит — она «опускает» статус. Прохор
        здесь нужен для имиджевого слоя (бренд-визуал, репутация девелопера), но не
        обещай лидген таргетом. Если заказчик ждёт от перформанса элитные сделки —
        останови его: это не тот инструмент, спалишь бюджет и размоешь позиционирование.


