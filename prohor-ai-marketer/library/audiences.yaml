# КОТТЕДЖНЫЕ ПОСЁЛКИ / ИЖС / ТАУНХАУСЫ
# ════════════════════════════════════════════════════════════════════════════
zagorod_izhs:
  тип_объекта: Коттеджные посёлки, ИЖС, таунхаусы
  стадия_релевантности: участок → подряд → готовый дом
  статус_контура: ранний контур — каркас сегментов, требует отраслевой верификации
  сегменты:

    - segment_id: izhs_family_house
      название: Семья «за своим домом и землёй»
      тип_объекта: Коттеджный посёлок / ИЖС / таунхаус
      jobs_to_be_done:
        - вырастить детей на земле, со двором и природой
        - получить пространство, которого не даёт квартира
        - уйти от соседей за стеной к приватности
      триггеры_покупки:
        - своя земля и двор, экология, тишина
        - сельская/загородная ипотека снижает порог
        - газ/коммуникации заведены (готовность к жизни, не стройплощадка)
        - школа/садик и магазины в доступности посёлка
      барьеры:
        - транспортная доступность и пробки до города
        - страх «недострой/недоведённые коммуникации»
        - содержание дома дороже и хлопотнее квартиры
        - удалённость инфраструктуры
      типовые_возражения:
        - «далеко возить детей в школу / ездить на работу»
        - «коммуникации точно подведены и работают»
        - «зимой как добираться, чистят ли дороги»
      демография:
        профиль:
          значение: "ориентир 30–45 лет, семьи с детьми, нужна машина"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет покупателя загородного дома ИЖС 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
      платежеспособность:
        бюджет:
          значение: "широкая вилка по классу посёлка; чувствителен к итоговой стоимости с коммуникациями"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'сельская ипотека условия 2026 загородный дом'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
        инструменты:
          значение: "ИЖС-ипотека / сельская ипотека / собственные средства + подряд"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'ипотека на ИЖС 2026 условия'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      приоритетные_каналы: [yandex_direct_search, vk_ads_performance, yandex_direct_rsya]
      комментарий_прохора: >
        Ранний контур — фактуру под бой надо верифицировать. Но базовая логика
        устойчивая: покупают землю и приватность, а главный страх — «доберусь ли и
        готовы ли коммуникации». Закроешь транспорт и инженерку честными цифрами —
        снимешь половину возражений. Не обещай «инвестиционный рост земли» — тот же
        юрфильтр.


# ════════════════════════════════════════════════════════════════════════════
# БИЗНЕС-ЦЕНТРЫ (БЦ) КЛАССА A И КОВОРКИНГИ  —  B2B, профиль ЛПР вместо демографии
# ════════════════════════════════════════════════════════════════════════════
bc_office:
  тип_объекта: Бизнес-центры (БЦ) класса A, коворкинги
  стадия_релевантности: строительство → ввод → заполнение → ротация арендаторов
  статус_контура: ранний контур (B2B) — требует отраслевой верификации перед боем
  логика: цель кампании — снижение вакантности и LTV арендатора, а не лиды с улицы
  сегменты:

    - segment_id: bc_cost_optimizer_tenant
      название: Арендатор, оптимизирующий косты (релокация офиса)
      тип_объекта: БЦ класса A
      jobs_to_be_done:
        - снизить стоимость аренды за метр без потери класса и локации
        - переехать в эффективную нарезку под фактическую численность
        - получить готовый офис без долгого ремонта (downtime = деньги)
      триггеры_покупки:
        - конкурентная ставка аренды за м² в классе A
        - готовая отделка / fit-out от арендодателя, быстрый въезд
        - транспортная доступность для сотрудников (метро, парковка)
        - гибкие условия договора и арендные каникулы
      барьеры:
        - стоимость и сроки переезда, простой бизнеса
        - привязка сотрудников к текущей локации
        - длинный цикл согласования аренды (несколько ЛПР)
        - неуверенность в заполняемости/инфраструктуре нового БЦ
      типовые_возражения:
        - «переезд встанет дороже экономии на ставке»
        - «сотрудники не доедут до новой локации»
        - «здание полупустое — что с эксплуатацией и соседями»
      профиль_ЛПР:
        роль:
          значение: "адм. директор / операционный директор / собственник; согласует CFO"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'кто принимает решение об аренде офиса B2B 2026'"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
        цикл_решения:
          значение: "длинный B2B-цикл, несколько согласований — не оценивать канал по лидам первой недели"
          тип_источника: object-claim
          ссылка_или_запрос: "см. library/funnels.yaml (логика длинной сделки)"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      платежеспособность:
        метрика:
          значение: "оценивается ставкой аренды за м²/год и LTV арендатора, не разовым чеком"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'ставка аренды офис класс A [город] 2026 руб м2'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
      приоритетные_каналы: [yandex_direct_search]
      комментарий_прохора: >
        Ранний контур и чистый B2B — VK-лидформой тут делать нечего, деловой ЛПР не в
        ленте соцсети в рабочем режиме. Метрика успеха не «лид», а снижение вакантности
        и длинный LTV арендатора. И главное правило длинной сделки: не убивай канал через
        две недели — цикл аренды офиса меряется месяцами и несколькими согласованиями.
        Полноценные B2B-каналы (деловые издания, отраслевые каталоги) подключаем в v2.


