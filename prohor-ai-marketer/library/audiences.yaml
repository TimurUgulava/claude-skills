# ЖК БИЗНЕС-КЛАСС
# ════════════════════════════════════════════════════════════════════════════
zhk_business:
  тип_объекта: ЖК (бизнес-класс)
  стадия_релевантности: монолит → отделка → сдача (готовность и статус важнее цены входа)
  сегменты:

    - segment_id: business_established_professionals
      название: Состоявшиеся профессионалы и руководители
      тип_объекта: ЖК бизнес
      jobs_to_be_done:
        - закрепить достигнутый статус «правильным» адресом и средой
        - получить продуманную среду: консьерж, паркинг, благоустройство, соседи «свои»
        - жить близко к деловому центру/работе без компромиссов спальника
      триггеры_покупки:
        - локация и адрес как маркер статуса
        - архитектура и среда (lobby, ландшафт, закрытая территория)
        - однородное «соседское» окружение
        - подземный паркинг ≥1 места на квартиру, кладовые
      барьеры:
        - «за эти деньги можно элитку в другом районе»
        - сомнение в «бизнес»-классе по факту (gap между обещанием и реализацией)
        - привязка к текущему престижному адресу
      типовые_возражения:
        - «это точно бизнес, а не комфорт с наценкой»
        - «соседи — кто будет жить, не массовый ли это дом»
        - «инфраструктура района дотягивает до уровня квартиры»
      демография:
        возраст:
          значение: "ориентир 35–50 лет"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'портрет покупателя ЖК бизнес-класс 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        профиль:
          значение: "топ-менеджмент, предприниматели, высокооплачиваемые специалисты"
          тип_источника: object-claim
          ссылка_или_запрос: "сверить с CRM заказчика"
          дата_актуализации: 2026-04-28
          статус: требует подтверждения
      платежеспособность:
        бюджет:
          значение: "высокая; цена не главный фактор, важна обоснованность статуса"
          тип_источника: object-claim
          ссылка_или_запрос: "WebSearch: 'средний бюджет ЖК бизнес класс [город] 2026'"
          дата_актуализации: 2026-04-28
          статус: требует актуализации через WebSearch
        инструменты:
          значение: "ипотека на крупную сумму / собственные средства / trade-in премиум-вторички"
          тип_источника: hypothesis
          ссылка_или_запрос: "проверяется структурой оплаты в CRM"
          дата_актуализации: 2026-04-28
          статус: гипотеза для A/B
      приоритетные_каналы: [yandex_direct_search, yandex_direct_rsya, cian]
      комментарий_прохора: >
        Бизнес-класс продаёт не метры, а среду и адрес. Этому сегменту бесполезно
        кричать про «низкий платёж» — он покупает соответствие статусу и однородное
        окружение. Самый опасный для тебя барьер — подозрение, что «бизнес» дорисован
        маркетингом: если реализация не дотягивает, лучше честно позиционировать как
        комфорт-плюс, чем словить разочарование и репутационный откат.


